                            ? renderTeamTasksTabHTML()
                            : renderLeavesSubtabHTML()}
            `;
        }

        function renderTeamMembersTabHTML() {
            const statuses = ['En poste', 'En pause', 'En congé', 'Hors ligne'];
            const canManageTeam = hasPermission('manageTeam');
            const canSeeAllEdt = hasPermission('viewAllSchedules');

            return `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${state.data.employees.map(emp => {
                        const isSelf = !isAdmin() && emp.id === state.connectedEmployeeId;
                        const canViewThisEdt = canSeeAllEdt || isSelf;
                        const planned = canViewThisEdt ? calcEmployeeWeeklyHours(emp.id) : 0;
                        const contract = Number(emp.weeklyHours) || 35;
                        const pct = Math.min(100, Math.round((planned / contract) * 100));
                        const isOver = planned > contract;
                        const canEditStatus = canManageTeam || isSelf;
                        const empTasks = state.data.tasks.filter(t => t.assigneeId === emp.id && t.status !== 'Terminé').length;
                        const pos = getEmployeePosition(emp);

                        return `
                        <div class="bg-white rounded-2xl border ${state.highlightId === emp.id ? 'border-indigo-500 ring-2 ring-indigo-200' : 'border-slate-200'} shadow-xs p-5 flex flex-col justify-between gap-4 transition">
                            <div>
                                <div class="flex items-start justify-between gap-3">
                                    <div class="flex items-center gap-3.5 min-w-0">
                                        <div class="w-12 h-12 rounded-2xl ${getAvatarColorClasses(emp.color)} flex items-center justify-center text-base font-bold shadow-xs shrink-0">
                                            ${getInitials(emp.name)}
                                        </div>
                                        <div class="min-w-0">
                                            <div class="flex items-center gap-2 flex-wrap">
                                                <h3 class="font-bold text-slate-900 text-base truncate">${escapeHtml(emp.name)}</h3>
                                                ${isSelf ? `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase bg-emerald-100 text-emerald-700">Vous</span>` : ''}
                                            </div>
                                            <div class="text-xs font-medium text-indigo-600 mt-0.5">${escapeHtml(pos ? pos.name : emp.roleTitle)}</div>
                                        </div>
                                    </div>

                                    <select onchange="updateMemberStatus('${emp.id}', this.value)" ${!canEditStatus ? 'disabled' : ''} class="text-[11px] font-semibold px-2.5 py-1 rounded-full border outline-none cursor-pointer disabled:cursor-not-allowed ${getMemberStatusBadge(emp.status)}">
                                        ${statuses.map(st => `<option value="${st}" ${emp.status === st ? 'selected' : ''}>${st}</option>`).join('')}
                                    </select>
                                </div>

                                <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-600 bg-slate-50 rounded-xl p-3 border border-slate-100">
                                    <div class="truncate"><span class="text-slate-400">E-mail :</span> ${escapeHtml(emp.email || '—')}</div>
                                    <div class="truncate"><span class="text-slate-400">Tél. :</span> ${escapeHtml(emp.phone || '—')}</div>
                                </div>

                                ${canViewThisEdt ? `
                                    <div class="mt-4">
                                        <div class="flex items-center justify-between text-xs mb-1.5">
                                            <span class="font-semibold text-slate-600">Heures planifiées cette semaine</span>
                                            <span class="font-bold ${isOver ? 'text-rose-600' : 'text-slate-900'}">${planned} h / ${contract} h (${pct}%)</span>
                                        </div>
                                        <div class="w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
                                            <div class="h-full rounded-full transition-all duration-300 ${isOver ? 'bg-rose-500' : pct >= 80 ? 'bg-emerald-500' : 'bg-indigo-600'}" style="width: ${pct}%"></div>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="mt-4 px-3 py-2 rounded-xl bg-slate-50 border border-slate-100 text-[11px] text-slate-400 flex items-center gap-1.5">
                                        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                                        Emploi du temps confidentiel
                                    </div>
                                `}
                            </div>

                            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2 flex-wrap">
                                <div class="flex items-center gap-2 text-xs text-slate-500">
                                    <span>${empTasks} tâche(s) active(s)</span>
                                    ${canViewThisEdt ? `
                                        <span>•</span>
                                        <button onclick="state.scheduleEmployeeFilter='${emp.id}'; navigate('schedule')" class="font-semibold text-indigo-600 hover:text-indigo-800">${isSelf ? 'Voir mon EDT →' : 'Voir son EDT →'}</button>
                                    ` : ''}
                                </div>
                                ${canManageTeam ? `
                                    <div class="flex items-center gap-1.5">
                                        <button onclick="openMemberModal('${emp.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Modifier</button>
                                        <button onclick="requestDeleteMember('${emp.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-rose-50 hover:bg-rose-100 text-rose-700 transition">Supprimer</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        function renderTeamPositionsTabHTML() {
            return `
                <div class="mb-4 p-4 rounded-2xl bg-indigo-50/70 border border-indigo-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="text-xs text-indigo-900">
                        <strong class="block text-sm">Gestion des Postes & Droits d'accès</strong>
                        Créez des postes personnalisés et choisissez précisément quels modules et actions sont autorisés pour les employés qui y sont rattachés.
                    </div>
                    <button onclick="openPositionModal()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shrink-0 transition">+ Nouveau poste</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${state.data.positions.map(pos => {
                        const assigned = state.data.employees.filter(e => e.positionId === pos.id);
                        const activePerms = PERMISSION_DEFS.filter(d => pos.permissions && pos.permissions[d.key]);
                        return `
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 flex flex-col justify-between gap-4">
                            <div>
                                <div class="flex items-start justify-between gap-3">
                                    <div class="flex items-center gap-3 min-w-0">
                                        <div class="w-10 h-10 rounded-xl ${getAvatarColorClasses(pos.color)} flex items-center justify-center text-xs font-bold shrink-0">
                                            ${getInitials(pos.name)}
                                        </div>
                                        <div class="min-w-0">
                                            <h3 class="font-bold text-slate-900 text-base truncate">${escapeHtml(pos.name)}</h3>
                                            <div class="text-xs text-slate-500">${assigned.length} membre(s) rattaché(s)</div>
                                        </div>
                                    </div>
                                    <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 text-[11px] font-bold shrink-0">${activePerms.length} / ${PERMISSION_DEFS.length} droits</span>
                                </div>

                                ${pos.description ? `<p class="text-xs text-slate-600 mt-3">${escapeHtml(pos.description)}</p>` : ''}

                                <div class="mt-3 flex flex-wrap gap-1.5">
                                    ${activePerms.length === 0
                                        ? `<span class="text-xs text-slate-400 italic">Aucun droit spécifique activé</span>`
                                        : activePerms.map(d => `<span class="px-2 py-0.5 rounded-lg text-[11px] font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">${escapeHtml(d.label)}</span>`).join('')}
                                </div>
                            </div>

                            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                                <div class="text-[11px] text-slate-500 truncate">
                                    ${assigned.length ? assigned.map(e => escapeHtml(e.name)).join(', ') : 'Aucun employé assigné'}
                                </div>
                                <div class="flex items-center gap-1.5 shrink-0">
                                    <button onclick="openPositionModal('${pos.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Modifier droits</button>
                                    <button onclick="requestDeletePosition('${pos.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-rose-50 hover:bg-rose-100 text-rose-700 transition">Supprimer</button>
                                </div>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        function openPositionModal(posId = null) {
            if (!hasPermission('manageTeam')) {
                showToast('Action réservée au rôle Admin / Direction.', 'warning');
                return;
            }
            const pos = posId ? getPositionById(posId) : null;
            const isEdit = !!pos;
            const colors = ['indigo', 'violet', 'sky', 'amber', 'emerald', 'rose'];
            const groups = [...new Set(PERMISSION_DEFS.map(p => p.group))];

            openModal(isEdit ? `Modifier le poste — ${pos.name}` : 'Créer un nouveau poste & ses droits', `
                <form id="position-form" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Nom du poste *</label>
                            <input type="text" name="name" required value="${escapeHtml(pos?.name || '')}" placeholder="Ex : Conseiller Showroom, Manager..." class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Couleur</label>
                            <select name="color" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                ${colors.map(c => `<option value="${c}" ${pos?.color === c ? 'selected' : ''}>${c.charAt(0).toUpperCase() + c.slice(1)}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Description du poste</label>
                        <input type="text" name="description" value="${escapeHtml(pos?.description || '')}" placeholder="Missions principales de ce poste..." class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 outline-none">
                    </div>

                    <div class="space-y-3 pt-1">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Droits & permissions attribués</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${groups.map(grp => `
                                <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                                    <div class="text-[11px] font-bold uppercase tracking-wider text-indigo-700">${escapeHtml(grp)}</div>
                                    ${PERMISSION_DEFS.filter(p => p.group === grp).map(p => {
                                        const checked = pos ? !!(pos.permissions && pos.permissions[p.key]) : (p.key === 'manageOwnAppointments');
                                        return `
                                        <label class="flex items-start gap-2 text-xs text-slate-700 cursor-pointer">
                                            <input type="checkbox" name="perm_${p.key}" ${checked ? 'checked' : ''} class="mt-0.5 rounded text-indigo-600">
                                            <span>${escapeHtml(p.label)}</span>
                                        </label>`;
                                    }).join('')}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100">Annuler</button>
                        <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700">${isEdit ? 'Enregistrer les droits' : 'Créer le poste'}</button>
                    </div>
                </form>
            `, 'max-w-3xl');

            document.getElementById('position-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const permissions = {};
                PERMISSION_DEFS.forEach(p => {
                    permissions[p.key] = !!fd.get(`perm_${p.key}`);
                });

                const payload = {
                    name: fd.get('name').trim(),
                    description: fd.get('description').trim(),
                    color: fd.get('color'),
                    permissions
                };

                if (isEdit) {
                    Object.assign(pos, payload);
                    state.data.employees.forEach(emp => {
                        if (emp.positionId === pos.id) emp.roleTitle = pos.name;
                    });
                    addLog('Équipe', `Droits du poste "${pos.name}" mis à jour.`);
                } else {
                    const created = { id: generateId('POS'), ...payload };
                    state.data.positions.push(created);
                    addLog('Équipe', `Nouveau poste créé : "${created.name}".`);
                }
                saveData();
                updateRoleUI();
                updateNavActiveState();
                closeModal();
                renderCurrentSection();
                showToast(isEdit ? 'Poste et droits mis à jour.' : 'Poste créé avec succès !', 'success');
            });
        }

        function requestDeletePosition(posId) {
            if (!hasPermission('manageTeam')) return;
            if (state.data.positions.length <= 1) {
                showToast('Vous devez conserver au moins un poste.', 'warning');
                return;
            }
            const pos = getPositionById(posId);
            if (!pos) return;
            const assigned = state.data.employees.filter(e => e.positionId === posId);
            if (assigned.length > 0) {
                showToast(`Impossible : ${assigned.length} membre(s) occupent encore ce poste. Réassignez-les d'abord.`, 'warning');
                return;
            }
            openConfirm({
                title: 'Supprimer ce poste ?',
                message: `Le poste "${pos.name}" et sa configuration de droits seront supprimés.`,
                confirmLabel: 'Supprimer',
                onConfirm: () => {
                    state.data.positions = state.data.positions.filter(p => p.id !== posId);
                    addLog('Équipe', `Poste supprimé : "${pos.name}".`);
                    saveData();
                    renderCurrentSection();
                    showToast('Poste supprimé.', 'info');
                }
            });
        }

        function renderTeamTasksTabHTML() {
            const tasks = state.data.tasks.filter(t => {
                const matchEmp = state.taskEmployeeFilter === 'ALL' || t.assigneeId === state.taskEmployeeFilter;
                const matchStatus = state.taskStatusFilter === 'ALL' || t.status === state.taskStatusFilter;
                return matchEmp && matchStatus;
            });

            return `
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4 bg-white p-3 rounded-2xl border border-slate-200">
                    <div class="flex flex-wrap items-center gap-2">
                        <select onchange="state.taskEmployeeFilter=this.value; renderCurrentSection()" class="text-xs font-semibold text-slate-700 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 outline-none">
                            <option value="ALL" ${state.taskEmployeeFilter === 'ALL' ? 'selected' : ''}>Tous les membres</option>
                            ${state.data.employees.map(e => `<option value="${e.id}" ${state.taskEmployeeFilter === e.id ? 'selected' : ''}>${escapeHtml(e.name)}</option>`).join('')}
                        </select>
                        <select onchange="state.taskStatusFilter=this.value; renderCurrentSection()" class="text-xs font-semibold text-slate-700 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 outline-none">
                            <option value="ALL" ${state.taskStatusFilter === 'ALL' ? 'selected' : ''}>Tous les statuts</option>
                            <option value="À faire" ${state.taskStatusFilter === 'À faire' ? 'selected' : ''}>À faire</option>
                            <option value="En cours" ${state.taskStatusFilter === 'En cours' ? 'selected' : ''}>En cours</option>
                            <option value="Terminé" ${state.taskStatusFilter === 'Terminé' ? 'selected' : ''}>Terminé</option>
                        </select>
                    </div>
                    <button onclick="openTaskModal()" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold transition">+ Créer une tâche</button>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-100 bg-slate-50/70 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                                    <th class="py-3.5 px-4">Mission / Tâche</th>
                                    <th class="py-3.5 px-4">Assigné à</th>
                                    <th class="py-3.5 px-4">Priorité</th>
                                    <th class="py-3.5 px-4">Échéance</th>
                                    <th class="py-3.5 px-4">Statut</th>
                                    <th class="py-3.5 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${tasks.length === 0 ? `<tr><td colspan="6" class="py-10 text-center text-slate-500 text-xs">Aucune tâche pour ces filtres.</td></tr>` : tasks.map(t => {
                                    const emp = getEmployeeById(t.assigneeId);
                                    const prioBadge = t.priority === 'Haute' ? 'bg-rose-100 text-rose-700'
                                        : t.priority === 'Normale' ? 'bg-amber-100 text-amber-800'
                                        : 'bg-slate-100 text-slate-600';
                                    const statusBadge = t.status === 'Terminé' ? 'bg-emerald-100 text-emerald-800'
                                        : t.status === 'En cours' ? 'bg-indigo-100 text-indigo-800'
                                        : 'bg-slate-100 text-slate-700';
                                    return `
                                    <tr class="hover:bg-slate-50/60 transition">
                                        <td class="py-3.5 px-4 font-semibold text-slate-900 ${t.status === 'Terminé' ? 'line-through text-slate-400' : ''}">${escapeHtml(t.title)}</td>
                                        <td class="py-3.5 px-4 text-xs text-slate-600 whitespace-nowrap">${escapeHtml(emp ? emp.name : 'Non assignée')}</td>
                                        <td class="py-3.5 px-4 whitespace-nowrap"><span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${prioBadge}">${escapeHtml(t.priority)}</span></td>
                                        <td class="py-3.5 px-4 text-xs text-slate-500 whitespace-nowrap">${formatDateFR(t.dueDate)}</td>
                                        <td class="py-3.5 px-4 whitespace-nowrap">
                                            <button onclick="advanceTaskStatus('${t.id}')" class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusBadge} hover:opacity-80 transition" title="Cliquer pour changer le statut">${escapeHtml(t.status)} ↻</button>
                                        </td>
                                        <td class="py-3.5 px-4 text-right whitespace-nowrap">
                                            <button onclick="openTaskModal('${t.id}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 mr-1">Modifier</button>
                                            ${isAdmin() ? `<button onclick="requestDeleteTask('${t.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50" title="Supprimer"><svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>` : ''}
                                        </td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function updateMemberStatus(empId, newStatus) {
            const emp = getEmployeeById(empId);
            if (!emp) return;
            if (!hasPermission('manageTeam') && emp.id !== state.connectedEmployeeId) {
                showToast('Vous ne pouvez modifier que votre propre statut.', 'warning');
                renderCurrentSection();
                return;
            }
            emp.status = newStatus;
            addLog('Équipe', `Statut de ${emp.name} mis à jour : ${newStatus}.`);
            saveData();
            renderCurrentSection();
            showToast(`${emp.name} : ${newStatus}`, 'info');
        }

        function requestDeleteMember(empId) {
            if (!hasPermission('manageTeam')) return;
            if (state.data.employees.length <= 1) {
                showToast('Impossible de supprimer le dernier membre de l\'équipe.', 'warning');
                return;
            }
            const emp = getEmployeeById(empId);
            if (!emp) return;
            openConfirm({
                title: 'Supprimer ce membre de l\'équipe ?',
                message: `${emp.name} sera retiré de l'équipe ainsi que ses créneaux planifiés.`,
                confirmLabel: 'Supprimer',
                onConfirm: () => {
                    state.data.employees = state.data.employees.filter(e => e.id !== empId);
                    state.data.scheduleEvents = state.data.scheduleEvents.filter(ev => ev.employeeId !== empId);
                    if (state.connectedEmployeeId === empId && state.data.employees.length) {
                        state.connectedEmployeeId = state.data.employees[0].id;
                    }
                    addLog('Équipe', `Membre supprimé : ${emp.name}.`);
                    saveData();
                    updateRoleUI();
                    renderCurrentSection();
                    showToast('Membre retiré de l\'équipe.', 'info');
                }
            });
        }

        function openTaskModal(taskId = null) {
            const task = taskId ? state.data.tasks.find(t => t.id === taskId) : null;
            const isEdit = !!task;

            openModal(isEdit ? 'Modifier la tâche' : 'Nouvelle tâche d\'équipe', `
                <form id="task-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Intitulé de la mission / tâche *</label>
                        <input type="text" name="title" required value="${escapeHtml(task?.title || '')}" placeholder="Ex : Préparer échantillons showroom..." class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Assignée à *</label>
                            <select name="assigneeId" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                ${state.data.employees.map(emp => `<option value="${emp.id}" ${(task ? task.assigneeId : state.connectedEmployeeId) === emp.id ? 'selected' : ''}>${escapeHtml(emp.name)}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Échéance *</label>
                            <input type="date" name="dueDate" required value="${task?.dueDate || offsetDate(2)}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Priorité</label>
                            <select name="priority" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                <option value="Haute" ${task?.priority === 'Haute' ? 'selected' : ''}>Haute</option>
                                <option value="Normale" ${!task || task.priority === 'Normale' ? 'selected' : ''}>Normale</option>
                                <option value="Basse" ${task?.priority === 'Basse' ? 'selected' : ''}>Basse</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Statut</label>
                            <select name="status" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                <option value="À faire" ${!task || task.status === 'À faire' ? 'selected' : ''}>À faire</option>
                                <option value="En cours" ${task?.status === 'En cours' ? 'selected' : ''}>En cours</option>
                                <option value="Terminé" ${task?.status === 'Terminé' ? 'selected' : ''}>Terminé</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100">Annuler</button>
                        <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700">${isEdit ? 'Enregistrer' : 'Créer la tâche'}</button>
                    </div>
                </form>
            `);

            document.getElementById('task-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const payload = {
                    title: fd.get('title').trim(),
                    assigneeId: fd.get('assigneeId'),
                    dueDate: fd.get('dueDate'),
                    priority: fd.get('priority'),
                    status: fd.get('status')
                };
                if (isEdit) {
                    Object.assign(task, payload);
                    addLog('Équipe', `Tâche modifiée : "${task.title}".`);
                } else {
                    const created = { id: generateId('TSK'), ...payload };
                    state.data.tasks.unshift(created);
                    addLog('Équipe', `Nouvelle tâche créée : "${created.title}".`);
                }
                saveData();
                closeModal();
                renderCurrentSection();
                showToast(isEdit ? 'Tâche mise à jour.' : 'Tâche ajoutée !', 'success');
            });
        }

        function openMemberModal(empId = null) {
            if (!hasPermission('manageTeam')) {
                showToast('Action réservée au rôle Admin / Direction.', 'warning');
                return;
            }
            const emp = empId ? getEmployeeById(empId) : null;
            const isEdit = !!emp;
            const colors = ['indigo', 'violet', 'sky', 'amber', 'emerald', 'rose'];

            openModal(isEdit ? 'Modifier la fiche membre' : 'Ajouter un membre à l\'équipe', `
                <form id="member-form" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Nom complet *</label>
                            <input type="text" name="name" required value="${escapeHtml(emp?.name || '')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Poste attribué (Droits) *</label>
                            <select name="positionId" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                ${state.data.positions.map(p => `<option value="${p.id}" ${emp?.positionId === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">E-mail professionnel *</label>
                            <input type="email" name="email" required value="${escapeHtml(emp?.email || '')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Téléphone</label>
                            <input type="text" name="phone" value="${escapeHtml(emp?.phone || '')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Contrat (h / semaine) *</label>
                            <input type="number" name="weeklyHours" min="5" max="60" required value="${emp ? emp.weeklyHours : 35}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Couleur d'avatar</label>
                            <select name="color" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                ${colors.map(c => `<option value="${c}" ${emp?.color === c ? 'selected' : ''}>${c.charAt(0).toUpperCase() + c.slice(1)}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100">Annuler</button>
                        <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700">${isEdit ? 'Enregistrer' : 'Ajouter le membre'}</button>
                    </div>
                </form>
            `);

            document.getElementById('member-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const selectedPos = getPositionById(fd.get('positionId'));
                const payload = {
                    name: fd.get('name').trim(),
                    positionId: selectedPos ? selectedPos.id : state.data.positions[0].id,
                    roleTitle: selectedPos ? selectedPos.name : 'Employé',
                    email: fd.get('email').trim(),
                    phone: fd.get('phone').trim(),
                    systemRole: (selectedPos && selectedPos.permissions && selectedPos.permissions.manageTeam) ? 'admin' : 'employee',
                    weeklyHours: Math.max(5, parseInt(fd.get('weeklyHours'), 10) || 35),
                    color: fd.get('color')
                };
                if (isEdit) {
                    Object.assign(emp, payload);
                    addLog('Équipe', `Fiche membre mise à jour : ${emp.name} (${emp.roleTitle}).`);
                } else {
                    const created = { id: generateId('EMP'), ...payload, status: 'En poste' };
                    state.data.employees.push(created);
                    addLog('Équipe', `Nouveau membre ajouté : ${created.name} (${created.roleTitle}, ${created.weeklyHours}h/sem).`);
                }
                saveData();
                updateRoleUI();
                updateNavActiveState();
                closeModal();
                renderCurrentSection();
                showToast(isEdit ? 'Fiche membre mise à jour.' : 'Membre ajouté à l\'équipe !', 'success');
            });
        }

        function advanceTaskStatus(taskId) {
            const t = state.data.tasks.find(x => x.id === taskId);
            if (!t) return;
            const cycle = { 'À faire': 'En cours', 'En cours': 'Terminé', 'Terminé': 'À faire' };
            t.status = cycle[t.status] || 'À faire';
            addLog('Équipe', `Statut de la tâche "${t.title}" passé à "${t.status}".`);
            saveData();
            renderCurrentSection();
            showToast(`Tâche : ${t.status}`, 'success');
        }

        function requestDeleteTask(taskId) {
            if (!isAdmin()) return;
            const t = state.data.tasks.find(x => x.id === taskId);
            if (!t) return;
            openConfirm({
                title: 'Supprimer cette tâche ?',
                message: `"${t.title}" sera supprimée définitivement.`,
                confirmLabel: 'Supprimer',
                onConfirm: () => {
                    state.data.tasks = state.data.tasks.filter(x => x.id !== taskId);
                    addLog('Équipe', `Tâche supprimée : "${t.title}".`);
                    saveData();
                    renderCurrentSection();
                    showToast('Tâche supprimée.', 'info');
                }
            });
        }

        /* ============================================================================
         * MODULE 7 : JOURNAL D'ACTIVITÉ (LOGS)
         * ============================================================================ */
        function renderLogs(container) {
            const categories = ['ALL', ...new Set(state.data.logs.map(l => l.category))];
            const q = (state.logSearchQuery || '').trim().toLowerCase();
            const logs = state.data.logs.filter(l => {
                const matchCat = state.logCategoryFilter === 'ALL' || l.category === state.logCategoryFilter;
                const matchQuery = !q || l.message.toLowerCase().includes(q) || l.actor.toLowerCase().includes(q) || l.category.toLowerCase().includes(q);
                return matchCat && matchQuery;
            });

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Journal d'activité (Audit)</h1>
                        <p class="text-sm text-slate-500 mt-0.5">Historique horodaté des opérations : équipe, tâches, photos, stock, horaires, RDV, factures et RGPD.</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <input type="text" value="${escapeHtml(state.logSearchQuery)}" oninput="state.logSearchQuery=this.value; renderCurrentSection()" placeholder="Filtrer le journal..." class="px-3.5 py-2 text-xs rounded-xl bg-white border border-slate-200 text-slate-700 outline-none focus:border-indigo-500">
                        <select onchange="state.logCategoryFilter=this.value; renderCurrentSection()" class="px-3.5 py-2 text-xs font-semibold rounded-xl bg-white border border-slate-200 text-slate-700 outline-none">
                            ${categories.map(c => `<option value="${escapeHtml(c)}" ${state.logCategoryFilter === c ? 'selected' : ''}>${c === 'ALL' ? 'Toutes les catégories' : escapeHtml(c)}</option>`).join('')}
                        </select>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden divide-y divide-slate-100">
                    ${logs.length === 0 ? `<div class="p-10 text-center text-sm text-slate-500">Aucune entrée.</div>` : logs.map(log => {
                        const isAdm = (log.actor || '').includes('Admin');
                        return `
                        <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-slate-50/70 transition">
                            <div class="flex items-start gap-3">
                                <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase bg-slate-100 text-slate-700 shrink-0">${escapeHtml(log.category)}</span>
                                <div>
                                    <p class="text-sm text-slate-800">${escapeHtml(log.message)}</p>
                                    <span class="inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded-full ${isAdm ? 'bg-indigo-50 text-indigo-700' : 'bg-emerald-50 text-emerald-700'}">${escapeHtml(log.actor)}</span>
                                </div>
                            </div>
                            <span class="text-xs text-slate-400 font-mono shrink-0">${formatDateTimeFR(log.timestamp)}</span>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        /* ============================================================================
         * 7. INITIALISATION AU CHARGEMENT
         * ============================================================================ */
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            updateRoleUI();
            updateSidebarBadges();
            updateNavActiveState();
            renderCurrentSection();
            openDemoWelcomeModal();
        });
    </script>
</body>
