    <!-- ==================== SCRIPT APPLICATIF ==================== -->
    <script>
        /* ============================================================================
         * 1. UTILITAIRES DE DATES, FORMATAGE & SÉCURITÉ
         * ============================================================================ */
        function toISODate(d) {
            const dt = d instanceof Date ? d : new Date(d);
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const day = String(dt.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function parseISODate(iso) {
            const [y, m, d] = String(iso || toISODate(new Date())).split('-').map(Number);
            return new Date(y, (m || 1) - 1, d || 1);
        }

        function offsetDate(days, baseIso = null) {
            const dt = baseIso ? parseISODate(baseIso) : new Date();
            dt.setDate(dt.getDate() + days);
            return toISODate(dt);
        }

        function addYearsISO(iso, years) {
            const dt = parseISODate(iso);
            dt.setFullYear(dt.getFullYear() + years);
            return toISODate(dt);
        }

        function getMondayOfWeek(iso) {
            const dt = parseISODate(iso);
            const day = dt.getDay(); // 0 = Dim, 1 = Lun...
            const diff = day === 0 ? -6 : 1 - day;
            dt.setDate(dt.getDate() + diff);
            return toISODate(dt);
        }

        function formatDateFR(iso, opts = { day: '2-digit', month: 'short', year: 'numeric' }) {
            if (!iso) return '—';
            return parseISODate(iso).toLocaleDateString('fr-FR', opts);
        }

        function formatDateTimeFR(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' +
                   d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        function formatEuro(val) {
            return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(Number(val) || 0);
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function generateId(prefix = 'ID') {
            return `${prefix}-${Date.now().toString(36).toUpperCase().slice(-4)}${Math.floor(10 + Math.random() * 89)}`;

        function timeToMinutes(hhmm) {
            const [h, m] = (hhmm || '09:00').split(':').map(Number);
            return h * 60 + (m || 0);
        }

        function getInitials(fullName) {
            return (fullName || '?').trim().split(/\s+/).slice(0, 2).map(w => (w[0] || '').toUpperCase()).join('');

            document.body.removeChild(ta);

        function downloadFile(filename, content, mimeType = 'text/plain;charset=utf-8') {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 500);
        }

        function calcEmployeeWeeklyHours(empId, anchorIso = offsetDate(0)) {
            const mon = getMondayOfWeek(anchorIso);
            const sun = offsetDate(6, mon);
            const shifts = state.data.scheduleEvents.filter(ev =>
                ev.type === 'work_shift' && ev.employeeId === empId && ev.date >= mon && ev.date <= sun
            );
            const totalMin = shifts.reduce((acc, ev) => acc + Math.max(0, timeToMinutes(ev.endTime) - timeToMinutes(ev.startTime)), 0);
            return Math.round((totalMin / 60) * 10) / 10;
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
            } catch (err) {
                showToast('Espace de stockage local saturé (essayez avec moins de photos lourdes).', 'warning');
            }
            updateSidebarBadges();
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.clients && parsed.products && parsed.scheduleEvents && parsed.employees && parsed.tasks && parsed.positions) {
                        state.data = parsed;
                        if (!state.data.employees.some(e => e.id === state.connectedEmployeeId) && state.data.employees.length) {
                            state.connectedEmployeeId = state.data.employees[0].id;
                        }
                        return;
                    }
                }
            } catch (e) {
                console.warn('Réinitialisation des données démo suite à une erreur localStorage.', e);
            }
            state.data = createDemoData();
            saveData();
        }

        function addLog(category, message) {
            state.data.logs.unshift({
                id: generateId('LOG'),
                timestamp: new Date().toISOString(),
                actor: getActorLabel(),
                category,
                message
            });
            if (state.data.logs.length > 150) {
                state.data.logs = state.data.logs.slice(0, 150);
            }
        }

                    saveData();

                    renderCurrentSection();
                    showToast('Données de démonstration réinitialisées.', 'info');
                }
            });
        }

        /* ============================================================================
         * 4. UI GLOBALE : TOASTS, MODALES, NAVIGATION, RÔLES & RECHERCHE
         * ============================================================================ */
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-emerald-600 text-white border-emerald-500',
                error: 'bg-rose-600 text-white border-rose-500',
                warning: 'bg-amber-500 text-slate-950 border-amber-400',
                info: 'bg-slate-900 text-white border-slate-700'
            };
            const el = document.createElement('div');
            el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-xs sm:text-sm font-medium flex items-center justify-between gap-3 transition-all duration-200 ${colors[type] || colors.info}`;
            el.innerHTML = `<span>${escapeHtml(message)}</span>`;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(8px)';
                setTimeout(() => el.remove(), 220);
            }, 3400);
        }

        function openModal(title, bodyHtml, maxWidthClass = 'max-w-2xl') {
            const overlay = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            box.className = `bg-white rounded-2xl shadow-2xl border border-slate-200 w-full ${maxWidthClass} max-h-[92vh] flex flex-col overflow-hidden`;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            overlay.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function openConfirm({ title, message, confirmLabel = 'Confirmer', onConfirm }) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            const btn = document.getElementById('confirm-action-btn');
            btn.textContent = confirmLabel;
            pendingConfirmCallback = onConfirm;
            document.getElementById('confirm-overlay').classList.remove('hidden');
        }

        function closeConfirm() {
            document.getElementById('confirm-overlay').classList.add('hidden');
            pendingConfirmCallback = null;
        }

        document.getElementById('confirm-action-btn').addEventListener('click', () => {
            const cb = pendingConfirmCallback;
            closeConfirm();
            if (typeof cb === 'function') cb();
        });

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        });

        function toggleMobileSidebar(force) {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const shouldOpen = typeof force === 'boolean' ? force : sidebar.classList.contains('-translate-x-full');
            sidebar.classList.toggle('-translate-x-full', !shouldOpen);
            backdrop.classList.toggle('hidden', !shouldOpen);
        }

        function switchRole(newRole) {
            state.role = newRole;
            if (newRole === 'employee') {
                const currentEmp = getEmployeeById(state.connectedEmployeeId);
                if (!currentEmp || currentEmp.systemRole === 'admin') {
                    const firstNonAdmin = state.data.employees.find(e => e.systemRole !== 'admin');
                    if (firstNonAdmin) state.connectedEmployeeId = firstNonAdmin.id;
                }
            }
            updateRoleUI();
            updateNavActiveState();
            renderCurrentSection();
            showToast(`Mode actif : ${newRole === 'admin' ? 'Admin / Direction' : 'Employé'}`, 'info');
        }

        function switchConnectedEmployee(empId) {
            state.connectedEmployeeId = empId;
            updateRoleUI();
            updateNavActiveState();
            renderCurrentSection();
        }

        function updateRoleUI() {
            const admBtn = document.getElementById('role-btn-admin');
            const empBtn = document.getElementById('role-btn-employee');
            const empWrap = document.getElementById('connected-employee-wrap');
            const empSelect = document.getElementById('connected-employee-select');
            const banner = document.getElementById('role-status-banner');

            if (isAdmin()) {
                admBtn.className = 'px-2 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 bg-white text-indigo-700 shadow-xs';
                empBtn.className = 'px-2 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 text-slate-500 hover:text-slate-700';
                empWrap.classList.add('hidden');
                empWrap.classList.remove('flex');
                banner.className = 'px-3 py-2.5 rounded-xl text-xs border bg-indigo-500/15 border-indigo-400/30 text-indigo-200';
                banner.innerHTML = `<div class="font-bold text-white">Mode Admin / Direction</div><div class="text-[11px] text-indigo-200/80 mt-0.5">Accès complet : Postes, RH & EDT</div>`;
            } else {
                admBtn.className = 'px-2 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 text-slate-500 hover:text-slate-700';
                empBtn.className = 'px-2 sm:px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 bg-white text-emerald-700 shadow-xs';
                empWrap.classList.remove('hidden');
                empWrap.classList.add('flex');
                empSelect.innerHTML = state.data.employees.map(e =>
                    `<option value="${e.id}" ${e.id === state.connectedEmployeeId ? 'selected' : ''}>${escapeHtml(e.name)} (${escapeHtml(e.roleTitle)})</option>`
                ).join('');
                const cur = getEmployeeById(state.connectedEmployeeId);
                const pos = getEmployeePosition(cur);
                const rightsCount = pos ? Object.values(pos.permissions || {}).filter(Boolean).length : 0;
                banner.className = 'px-3 py-2.5 rounded-xl text-xs border bg-emerald-500/15 border-emerald-400/30 text-emerald-200';
                banner.innerHTML = `<div class="font-bold text-white truncate">${escapeHtml(cur ? cur.name : 'Employé')}</div><div class="text-[11px] text-emerald-200/90 mt-0.5 truncate">${escapeHtml(pos ? pos.name : cur?.roleTitle || '')} • ${rightsCount} droit(s)</div>`;
            }
        }

        function updateSidebarBadges() {
            const clientsCount = state.data.clients.filter(c => !c.anonymized).length;
            const pendingQuotes = state.data.documents.filter(d => d.type === 'devis' && d.status === 'En attente').length;
            const lowStockCount = state.data.products.filter(p => p.stock <= p.threshold).length;
            const pendingLeaves = state.data.leaves.filter(l => l.status === 'En attente').length;
            const activeTasks = state.data.tasks.filter(t => t.status !== 'Terminé').length;

            document.getElementById('badge-clients').textContent = clientsCount;

            const bQuotes = document.getElementById('badge-pending-quotes');
            bQuotes.textContent = pendingQuotes;
            bQuotes.classList.toggle('hidden', pendingQuotes === 0);

            const bStock = document.getElementById('badge-low-stock');
            bStock.textContent = lowStockCount;
            bStock.classList.toggle('hidden', lowStockCount === 0);

            const bLeaves = document.getElementById('badge-pending-leaves');
            bLeaves.textContent = pendingLeaves;
            bLeaves.classList.toggle('hidden', pendingLeaves === 0);

            const bTasks = document.getElementById('badge-team-tasks');
            bTasks.textContent = activeTasks;
            bTasks.classList.toggle('hidden', activeTasks === 0);
        }

        function canAccessSection(section) {
            if (isAdmin()) return true;
            switch (section) {
                case 'overview': return true;
                case 'clients': return hasPermission('viewClients') || hasPermission('editClients');
                case 'billing': return hasPermission('manageBilling');
                case 'inventory': return true; // Vitrine consultable, gestion selon manageStock
                case 'schedule': return true; // EDT personnel uniquement sans viewAllSchedules
                case 'team': return true; // Membres/tâches/congés perso, postes selon manageTeam
                case 'logs': return hasPermission('viewLogs');
                default: return true;
            }
        }

        function updateNavActiveState() {
            document.querySelectorAll('.nav-item').forEach(btn => {
                const sec = btn.dataset.nav;
                const allowed = canAccessSection(sec);
                btn.classList.toggle('hidden', !allowed);
                const active = sec === state.currentSection;
                btn.className = `nav-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition ${!allowed ? 'hidden ' : ''}${
                    active ? 'bg-indigo-600 text-white shadow-md shadow-indigo-950/50' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                }`;
            });
        }

        function navigate(section, options = {}) {
            state.currentSection = section;
            state.highlightId = options.highlightId || null;
            if (typeof options.inventoryOnlyLowStock === 'boolean') {
                state.inventoryOnlyLowStock = options.inventoryOnlyLowStock;
            }
            if (options.calendarAnchorDate) {
                state.calendarAnchorDate = options.calendarAnchorDate;
            }
            toggleMobileSidebar(false);
            updateNavActiveState();
            renderCurrentSection();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* Recherche globale */
        function handleGlobalSearch(query) {
            const resultsBox = document.getElementById('global-search-results');
            const clearBtn = document.getElementById('clear-search-btn');
            const q = (query || '').trim().toLowerCase();
            clearBtn.classList.toggle('hidden', !q);

            if (!q) {
                resultsBox.classList.add('hidden');
                return;
            }

            const matchedClients = (hasPermission('viewClients') || hasPermission('editClients'))
                ? state.data.clients.filter(c =>
                    !c.anonymized && (c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || (c.notes || '').toLowerCase().includes(q))
                )
                : [];
            const matchedProducts = state.data.products.filter(p =>
                p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)
            );
            const matchedDocs = hasPermission('manageBilling')
                ? state.data.documents.filter(d => {
                    const client = getClientById(d.clientId);
                    return d.id.toLowerCase().includes(q) || d.type.toLowerCase().includes(q) || (client && client.name.toLowerCase().includes(q));
                })
                : [];
            const matchedEmployees = state.data.employees.filter(emp =>
                emp.name.toLowerCase().includes(q) || (emp.roleTitle || '').toLowerCase().includes(q) || (emp.email || '').toLowerCase().includes(q)
            );
            const matchedRdvs = state.data.scheduleEvents.filter(ev => {
                if (!hasPermission('viewAllSchedules') && ev.employeeId !== state.connectedEmployeeId) return false;
                const emp = getEmployeeById(ev.employeeId);
                const client = ev.clientId ? getClientById(ev.clientId) : null;
                return ev.title.toLowerCase().includes(q) ||
                    (ev.notes || '').toLowerCase().includes(q) ||
                    (emp && emp.name.toLowerCase().includes(q)) ||
                    (client && client.name.toLowerCase().includes(q));
            });

            if (!matchedClients.length && !matchedProducts.length && !matchedDocs.length && !matchedEmployees.length && !matchedRdvs.length) {
                resultsBox.innerHTML = `<div class="p-4 text-xs sm:text-sm text-slate-500 text-center">Aucun résultat pour « ${escapeHtml(query)} »</div>`;
                resultsBox.classList.remove('hidden');
                return;
            }

            let html = '';
            if (matchedEmployees.length) {
                html += `<div class="p-2"><div class="px-2 py-1 text-[10px] font-bold uppercase text-slate-400">Équipe (${matchedEmployees.length})</div>`;
                matchedEmployees.slice(0, 3).forEach(emp => {
                    html += `<button onclick="jumpFromSearch('team','${emp.id}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-indigo-50 flex items-center justify-between transition">
                        <div class="min-w-0 pr-2"><div class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(emp.name)}</div><div class="text-[11px] text-slate-500 truncate">${escapeHtml(emp.roleTitle)}</div></div>
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border shrink-0 ${getMemberStatusBadge(emp.status)}">${escapeHtml(emp.status)}</span>
                    </button>`;
                });
                html += `</div>`;
            }
            if (matchedClients.length) {
                html += `<div class="p-2"><div class="px-2 py-1 text-[10px] font-bold uppercase text-slate-400">Clients (${matchedClients.length})</div>`;
                matchedClients.slice(0, 3).forEach(c => {
                    html += `<button onclick="jumpFromSearch('clients','${c.id}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-indigo-50 flex items-center justify-between transition">
                        <div class="min-w-0 pr-2"><div class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(c.name)}</div><div class="text-[11px] text-slate-500 truncate">${escapeHtml(c.email)}</div></div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 shrink-0">${c.points} pts</span>
                    </button>`;
                });
                html += `</div>`;
            }
            if (matchedProducts.length) {
                html += `<div class="p-2"><div class="px-2 py-1 text-[10px] font-bold uppercase text-slate-400">Produits (${matchedProducts.length})</div>`;
                matchedProducts.slice(0, 3).forEach(p => {
                    html += `<button onclick="jumpFromSearch('inventory','${p.id}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-indigo-50 flex items-center justify-between transition">
                        <div class="min-w-0 pr-2"><div class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(p.name)}</div><div class="text-[11px] text-slate-500">${formatEuro(p.price)} • Stock : ${p.stock}</div></div>
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 shrink-0">${escapeHtml(p.status)}</span>
                    </button>`;
                });
                html += `</div>`;
            }
            if (matchedDocs.length) {
                html += `<div class="p-2"><div class="px-2 py-1 text-[10px] font-bold uppercase text-slate-400">Devis & Factures (${matchedDocs.length})</div>`;
                matchedDocs.slice(0, 3).forEach(d => {
                    const cl = getClientById(d.clientId);
                    html += `<button onclick="jumpFromSearch('billing','${d.id}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-indigo-50 flex items-center justify-between transition">
                        <div class="min-w-0 pr-2"><div class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(d.id)} — ${escapeHtml(cl ? cl.name : '')}</div><div class="text-[11px] text-slate-500">${formatEuro(calcDocTotal(d))}</div></div>
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 shrink-0">${escapeHtml(d.status)}</span>
                    </button>`;
                });
                html += `</div>`;
            }
            if (matchedRdvs.length) {
                html += `<div class="p-2"><div class="px-2 py-1 text-[10px] font-bold uppercase text-slate-400">Planning & RDV (${matchedRdvs.length})</div>`;
                matchedRdvs.slice(0, 3).forEach(ev => {
                    html += `<button onclick="jumpFromSearch('schedule','${ev.id}','${ev.date}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-indigo-50 flex items-center justify-between transition">
                        <div class="min-w-0 pr-2"><div class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(ev.title)}</div><div class="text-[11px] text-slate-500">${formatDateFR(ev.date)} • ${ev.startTime}-${ev.endTime}</div></div>
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${ev.type === 'appointment' ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-100 text-indigo-700'} shrink-0">${ev.type === 'appointment' ? 'RDV' : 'Horaire'}</span>
                    </button>`;
                });
                html += `</div>`;
            }

            resultsBox.innerHTML = html;
            resultsBox.classList.remove('hidden');
        }

        function clearGlobalSearch() {
            const input = document.getElementById('global-search-input');
            input.value = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
            document.getElementById('global-search-results').classList.add('hidden');
        }

        function jumpFromSearch(section, id, eventDate = null) {
            clearGlobalSearch();
            if (section === 'inventory') state.inventoryOnlyLowStock = false;
            if (section === 'billing') state.billingFilter = 'all';
            if (section === 'schedule') state.scheduleTab = 'calendar';
            if (section === 'team') state.teamTab = 'members';
            navigate(section, { highlightId: id, calendarAnchorDate: eventDate || undefined });
        }

        document.addEventListener('click', (e) => {
            const box = document.getElementById('global-search-results');
            const input = document.getElementById('global-search-input');
            if (box && !box.contains(e.target) && e.target !== input) {
                box.classList.add('hidden');
            }
        });

        /* ============================================================================
         * 5. ROUTEUR DE RENDU PRINCIPAL
         * ============================================================================ */

            const container = document.getElementById('main-content');
            if (!canAccessSection(state.currentSection)) {

                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>

                    </div>

                return;

            switch (state.currentSection) {
                case 'overview': renderOverview(container); break;

            }
        }

                    <div onclick="navigate('${canSeeAllEdt ? 'team' : 'schedule'}')" class="cursor-pointer bg-white rounded-2xl p-5 border border-slate-200 shadow-xs hover:border-indigo-300 transition">

                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            </div>

                        ${canSeeAllEdt ? `
                            <div class="flex items-baseline gap-2 mt-3">

                            </div>
                            <div class="text-xs text-indigo-600 font-medium mt-1 truncate">
                                ${activeTeamToday.map(e => e.name.split(' ')[0]).join(', ') || 'Aucun membre en poste'}
                            </div>
                        ` : `
                            <div class="flex items-baseline gap-2 mt-3">
                                <span class="text-2xl font-bold text-slate-900">${todayShifts.length} créneau</span>
                                <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">${todayRdvs.length} RDV</span>

                            <div class="text-xs text-indigo-600 font-medium mt-1 truncate">
                                ${todayShifts[0] ? `${todayShifts[0].startTime}–${todayShifts[0].endTime}` : 'Aucun horaire aujourd\'hui'}
                            </div>
                        `}

                <!-- Widgets synthétiques -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="space-y-6">
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                                    <h2 class="font-bold text-slate-900 text-sm">${canSeeAllEdt ? 'Équipe du jour (Horaires & Statut)' : 'Mon planning du jour (Privé)'}</h2>
                                </div>
                                <button onclick="navigate('${canSeeAllEdt ? 'team' : 'schedule'}')" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">${canSeeAllEdt ? 'Gérer l\'équipe →' : 'Mon calendrier →'}</button>
                            </div>
                            <div class="p-4 space-y-2.5">
                                ${canSeeAllEdt ? state.data.employees.map(emp => {
                                    const shift = todayShifts.find(s => s.employeeId === emp.id);
                                    return `
                                    <div onclick="navigate('team', { highlightId: '${emp.id}' })" class="cursor-pointer p-2.5 rounded-xl border border-slate-100 hover:border-indigo-200 hover:bg-slate-50/70 flex items-center justify-between gap-3 transition">
                                        <div class="flex items-center gap-3 min-w-0">
                                            <div class="w-9 h-9 rounded-xl ${getAvatarColorClasses(emp.color)} flex items-center justify-center text-xs font-bold shrink-0">${getInitials(emp.name)}</div>
                                            <div class="min-w-0">
                                                <div class="text-sm font-semibold text-slate-900 truncate">${escapeHtml(emp.name)}</div>
                                                <div class="text-[11px] text-slate-500 truncate">${escapeHtml(emp.roleTitle)} • ${shift ? `${shift.startTime}–${shift.endTime}` : 'Pas de créneau aujourd\'hui'}</div>
                                            </div>
                                        </div>
                                        <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold border shrink-0 ${getMemberStatusBadge(emp.status)}">${escapeHtml(emp.status)}</span>
                                    </div>`;
                                }).join('') : (
                                    visibleEventsToday.length === 0
                                        ? `<div class="text-center py-6 text-xs text-slate-500">Aucun horaire ni RDV prévu aujourd'hui dans votre emploi du temps.</div>`
                                        : visibleEventsToday.sort((a, b) => a.startTime.localeCompare(b.startTime)).map(ev => `
                                            <div onclick="navigate('schedule')" class="cursor-pointer p-3 rounded-xl border ${ev.type === 'appointment' ? 'border-emerald-200 bg-emerald-50/50' : 'border-indigo-200 bg-indigo-50/50'} flex items-center justify-between gap-3">
                                                <div class="min-w-0">
                                                    <div class="text-xs font-bold ${ev.type === 'appointment' ? 'text-emerald-800' : 'text-indigo-800'} truncate">${escapeHtml(ev.title)}</div>
                                                    <div class="text-[11px] text-slate-500 mt-0.5">${ev.startTime}–${ev.endTime}${ev.location ? ` • ${escapeHtml(ev.location)}` : ''}</div>
                                                </div>
                                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${ev.type === 'appointment' ? 'bg-emerald-600 text-white' : 'bg-indigo-600 text-white'} shrink-0">${ev.type === 'appointment' ? 'RDV' : 'Travail'}</span>
                                            </div>
                                        `).join('')
                                )}
                            </div>
                        </div>

                        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                                    <h2 class="font-bold text-slate-900 text-sm">Alertes de stock critique</h2>
                                </div>
                                <button onclick="navigate('inventory', { inventoryOnlyLowStock: ${hasPermission('manageStock')} })" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">Gérer le stock →</button>
                            </div>
                            <div class="p-4">
                                ${lowStockProducts.length === 0 ? `
                                    <div class="text-center py-6 text-xs text-slate-500">Tous les stocks sont confortables.</div>
                                ` : `
                                    <div class="space-y-2">
                                        ${lowStockProducts.map(p => `
                                            <div onclick="navigate('inventory', { highlightId: '${p.id}', inventoryOnlyLowStock: false })" class="cursor-pointer p-2.5 rounded-xl border border-slate-100 hover:border-rose-200 hover:bg-rose-50/40 flex items-center justify-between gap-3 transition">
                                                <div class="flex items-center gap-3 min-w-0">
                                                    <img src="${escapeHtml((p.photos && p.photos[0]?.url) || FALLBACK_IMG)}" onerror="this.src='${FALLBACK_IMG}'" alt="" class="w-10 h-10 rounded-lg object-cover border border-slate-200 shrink-0">
                                                    <div class="min-w-0">
                                                        <div class="text-xs sm:text-sm font-semibold text-slate-800 truncate">${escapeHtml(p.name)}</div>
                                                        <div class="text-[11px] text-slate-500">Seuil : ${p.threshold}</div>
                                                    </div>
                                                </div>
                                                <span class="px-2.5 py-1 rounded-full text-xs font-bold shrink-0 ${p.stock === 0 ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}">
                                                    ${p.stock === 0 ? 'Rupture' : `Stock : ${p.stock}`}
                                                </span>
                                            </div>
                                        `).join('')}
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                                    <h2 class="font-bold text-slate-900 text-sm">Tâches d'équipe prioritaires</h2>
                                </div>
                                <button onclick="state.teamTab='tasks'; navigate('team')" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">Toutes les tâches →</button>
                            </div>
                            <div class="p-4 space-y-2.5">
                                ${priorityTasks.length === 0 ? `
                                    <div class="text-center py-6 text-xs text-slate-500">Aucune tâche en attente. Bravo !</div>
                                ` : priorityTasks.map(t => {
                                    const emp = getEmployeeById(t.assigneeId);
                                    const prioClass = t.priority === 'Haute' ? 'bg-rose-100 text-rose-700' : t.priority === 'Normale' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600';
                                    return `
                                    <div class="p-3 rounded-xl border border-slate-100 hover:border-indigo-200 flex items-center justify-between gap-3 transition">
                                        <div class="min-w-0">
                                            <div class="flex items-center gap-2 flex-wrap">
                                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase ${prioClass}">${escapeHtml(t.priority)}</span>
                                                <span class="text-xs font-semibold text-slate-900 truncate">${escapeHtml(t.title)}</span>
                                            </div>
                                            <div class="text-[11px] text-slate-500 mt-1">${escapeHtml(emp ? emp.name : 'Non assignée')} • Échéance : ${formatDateFR(t.dueDate)}</div>
                                        </div>
                                        <button onclick="advanceTaskStatus('${t.id}')" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 shrink-0 transition" title="Faire avancer le statut">
                                            ${escapeHtml(t.status)} →
                                        </button>
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>

                        ${hasPermission('viewLogs') ? `
                            <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                                <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                                    <h2 class="font-bold text-slate-900 text-sm">Journal d'activité récent</h2>
                                    <button onclick="navigate('logs')" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">Tout voir →</button>
                                </div>
                                <div class="divide-y divide-slate-100">
                                    ${recentLogs.map(log => `
                                        <div class="px-5 py-3 flex items-start justify-between gap-3">
                                            <div class="min-w-0">
                                                <div class="flex items-center gap-2 mb-0.5 flex-wrap">
                                                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-md bg-slate-100 text-slate-700">${escapeHtml(log.category)}</span>
                                                    <span class="text-[11px] text-slate-400">${escapeHtml(log.actor)}</span>
                                                </div>
                                                <p class="text-xs text-slate-700 leading-relaxed">${escapeHtml(log.message)}</p>
                                            </div>
                                            <span class="text-[11px] text-slate-400 shrink-0">${formatDateTimeFR(log.timestamp)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        /* ============================================================================
         * MODULE 2 : CLIENTS & CRM (FIDÉLITÉ & CONFORMITÉ RGPD)
         * ============================================================================ */
        function renderClients(container) {
            const clients = state.data.clients;
            const canEdit = hasPermission('editClients');

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Clients & CRM (RGPD)</h1>
                        <p class="text-sm text-slate-500 mt-0.5">Fiches clients, notes internes, points de fidélité, consentement et droits RGPD (export & anonymisation).</p>
                    </div>
                    ${canEdit ? `
                        <button onclick="openClientModal()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-xs transition shrink-0">
                            + Nouveau client
                        </button>
                    ` : `<span class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600 text-xs font-semibold">Lecture seule selon votre poste</span>`}
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${clients.map(c => `
                        <div class="bg-white rounded-2xl border ${state.highlightId === c.id ? 'border-indigo-500 ring-2 ring-indigo-200' : 'border-slate-200'} shadow-xs p-5 flex flex-col justify-between gap-4 ${c.anonymized ? 'opacity-65 bg-slate-50' : ''}">
                            <div>
                                <div class="flex items-start justify-between gap-3">
                                    <div class="min-w-0">
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <h3 class="font-bold text-slate-900 text-base truncate">${escapeHtml(c.name)}</h3>
                                            ${c.anonymized
                                                ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-200 text-slate-700 uppercase">Anonymisé RGPD</span>`
                                                : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">RGPD OK • Exp. ${formatDateFR(c.retentionLimit)}</span>`}
                                        </div>
                                        <div class="text-xs text-slate-500 mt-1">${escapeHtml(c.email)} • ${escapeHtml(c.phone || '—')}</div>
                                    </div>
                                    <div class="text-right shrink-0">
                                        <div class="text-[10px] uppercase font-bold text-slate-400">Fidélité</div>
                                        <div class="flex items-center gap-1.5 mt-0.5">
                                            ${!c.anonymized && canEdit ? `<button onclick="adjustClientPoints('${c.id}', -10)" class="w-6 h-6 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">-10</button>` : ''}
                                            <span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-xs font-bold">${c.points} pts</span>
                                            ${!c.anonymized && canEdit ? `<button onclick="adjustClientPoints('${c.id}', 10)" class="w-6 h-6 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">+10</button>` : ''}
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-3 p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs text-slate-600 leading-relaxed">
                                    <span class="font-semibold text-slate-700">Notes :</span> ${escapeHtml(c.notes || 'Aucune note enregistrée.')}
                                </div>
                            </div>

                            ${!c.anonymized ? `
                                <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2 flex-wrap">
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        ${canEdit ? `<button onclick="openClientModal('${c.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Modifier</button>` : ''}
                                        <button onclick="exportClientRGPD('${c.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 transition">Export JSON (RGPD)</button>
                                    </div>
                                    ${isAdmin() ? `
                                        <button onclick="requestAnonymizeClient('${c.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-rose-50 hover:bg-rose-100 text-rose-700 transition">
                                            Anonymiser (Oubli)
                                        </button>
                                    ` : ''}
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function openClientModal(clientId = null) {
            const client = clientId ? getClientById(clientId) : null;
            const isEdit = !!client;
            const today = offsetDate(0);

            openModal(isEdit ? 'Modifier la fiche client' : 'Nouveau dossier client (RGPD)', `
                <form id="client-form" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Nom complet *</label>
                            <input type="text" name="name" required value="${escapeHtml(client?.name || '')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">E-mail *</label>
                            <input type="email" name="email" required value="${escapeHtml(client?.email || '')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Téléphone</label>
                            <input type="text" name="phone" value="${escapeHtml(client?.phone || '')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Points de fidélité</label>
                            <input type="number" name="points" min="0" value="${client ? client.points : 0}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Notes internes (préférences, projets...)</label>
                        <textarea name="notes" rows="3" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">${escapeHtml(client?.notes || '')}</textarea>
                    </div>
                    <label class="flex items-start gap-2.5 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-900 cursor-pointer">
                        <input type="checkbox" name="consentement" required ${client?.consentement ? 'checked' : ''} class="mt-0.5 rounded text-emerald-600">
                        <span><strong>Consentement RGPD obligatoire :</strong> Le client consent à l'enregistrement de ses coordonnées pour le suivi commercial et la fidélité (durée de conservation : 3 ans).</span>
                    </label>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100">Annuler</button>
                        <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700">${isEdit ? 'Enregistrer' : 'Créer la fiche'}</button>
                    </div>
                </form>
            `);

            document.getElementById('client-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const payload = {
                    name: fd.get('name').trim(),
                    email: fd.get('email').trim(),
                    phone: fd.get('phone').trim(),
                    points: Math.max(0, parseInt(fd.get('points'), 10) || 0),
                    notes: fd.get('notes').trim(),
                    consentement: true
                };

                if (isEdit) {
                    Object.assign(client, payload);
                    addLog('CRM', `Fiche client modifiée : ${client.name}.`);
                } else {
                    const created = {
                        id: generateId('CLI'),
                        ...payload,
                        dateConsentement: today,
                        retentionLimit: addYearsISO(today, 3),
                        anonymized: false
                    };
                    state.data.clients.unshift(created);
                    addLog('CRM', `Nouveau client créé : ${created.name} (consentement RGPD enregistré).`);
                }
                saveData();
                closeModal();
                renderCurrentSection();
                showToast(isEdit ? 'Fiche client mise à jour.' : 'Client ajouté au CRM.', 'success');
            });
        }

        function adjustClientPoints(clientId, delta) {
            const c = getClientById(clientId);
            if (!c || c.anonymized) return;
            c.points = Math.max(0, (c.points || 0) + delta);
            addLog('CRM', `Points de fidélité de ${c.name} ajustés (${delta > 0 ? '+' : ''}${delta} → ${c.points} pts).`);
            saveData();
            renderCurrentSection();
        }

        function exportClientRGPD(clientId) {
            const c = getClientById(clientId);
            if (!c) return;
            const docs = state.data.documents.filter(d => d.clientId === c.id);
            const payload = {
                exportRGPD: true,
                exportedAt: new Date().toISOString(),
                client: c,
                documents: docs
            };
            downloadFile(`rgpd-export-${c.id.toLowerCase()}.json`, JSON.stringify(payload, null, 2), 'application/json');
            addLog('RGPD', `Export de portabilité JSON généré pour ${c.name}.`);
            saveData();
            showToast(`Export RGPD téléchargé pour ${c.name}.`, 'success');
        }

        function requestAnonymizeClient(clientId) {
            if (!isAdmin()) return;
            const c = getClientById(clientId);
            if (!c || c.anonymized) return;
            openConfirm({
                title: 'Anonymiser ce client (Droit à l\'oubli RGPD) ?',
                message: `Les données personnelles de "${c.name}" seront définitivement effacées tout en conservant les montants comptables des factures.`,
                confirmLabel: 'Anonymiser',
                onConfirm: () => {
                    const oldName = c.name;
                    c.name = `Client Anonymisé #${c.id}`;
                    c.email = `anonyme-${c.id.toLowerCase()}@rgpd.local`;
                    c.phone = '00 00 00 00 00';
                    c.notes = '[Effacé conformément au RGPD Art. 17]';
                    c.anonymized = true;
                    addLog('RGPD', `Droit à l'oubli appliqué : "${oldName}" anonymisé (${c.id}).`);
                    saveData();
                    renderCurrentSection();
                    showToast('Dossier client anonymisé conformément au RGPD.', 'info');
                }
            });
        }

        /* ============================================================================
         * MODULE 3 : DEVIS & FACTURES INFORMELS
         * ============================================================================ */
        function renderBilling(container) {
            const docs = state.data.documents.filter(d =>
                state.billingFilter === 'all' ? true : d.type === state.billingFilter
            );

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Devis & Factures informels</h1>
                        <p class="text-sm text-slate-500 mt-0.5">Conversion devis → facture en 1 clic, crédit automatique de fidélité au paiement et aperçu PDF.</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="openDocModal('devis')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold shadow-xs transition">
                            + Nouveau devis
                        </button>
                        <button onclick="openDocModal('facture')" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-semibold shadow-xs transition">
                            + Nouvelle facture
                        </button>
                    </div>
                </div>

                <!-- Filtres -->
                <div class="flex flex-wrap items-center gap-2 mb-5">
                    <button onclick="state.billingFilter='all'; renderCurrentSection()" class="px-4 py-2 rounded-xl text-xs font-semibold transition ${state.billingFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                        Tous (${state.data.documents.length})
                    </button>
                    <button onclick="state.billingFilter='devis'; renderCurrentSection()" class="px-4 py-2 rounded-xl text-xs font-semibold transition ${state.billingFilter === 'devis' ? 'bg-amber-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                        Devis (${state.data.documents.filter(d => d.type === 'devis').length})
                    </button>
                    <button onclick="state.billingFilter='facture'; renderCurrentSection()" class="px-4 py-2 rounded-xl text-xs font-semibold transition ${state.billingFilter === 'facture' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                        Factures (${state.data.documents.filter(d => d.type === 'facture').length})
                    </button>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-100 bg-slate-50/70 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                                    <th class="py-3.5 px-4">Référence</th>
                                    <th class="py-3.5 px-4">Client</th>
                                    <th class="py-3.5 px-4">Date</th>
                                    <th class="py-3.5 px-4">Montant</th>
                                    <th class="py-3.5 px-4">Statut</th>
                                    <th class="py-3.5 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${docs.length === 0 ? `<tr><td colspan="6" class="py-10 text-center text-slate-500 text-xs">Aucun document.</td></tr>` : docs.map(d => {
                                    const cl = getClientById(d.clientId);
                                    const total = calcDocTotal(d);
                                    const statusClass = d.status === 'Payée' || d.status === 'Validé'
                                        ? 'bg-emerald-100 text-emerald-800'
                                        : 'bg-amber-100 text-amber-800';
                                    return `
                                    <tr class="${state.highlightId === d.id ? 'bg-indigo-50/70' : 'hover:bg-slate-50/60'} transition">
                                        <td class="py-3.5 px-4 font-mono font-bold text-slate-900 whitespace-nowrap">
                                            ${escapeHtml(d.id)}
                                            <span class="ml-1.5 px-2 py-0.5 rounded text-[10px] font-sans font-bold uppercase ${d.type === 'devis' ? 'bg-indigo-50 text-indigo-700' : 'bg-slate-100 text-slate-700'}">${d.type}</span>
                                        </td>
                                        <td class="py-3.5 px-4 font-medium text-slate-800">${escapeHtml(cl ? cl.name : 'Client inconnu')}</td>
                                        <td class="py-3.5 px-4 text-xs text-slate-500 whitespace-nowrap">${formatDateFR(d.date)}</td>
                                        <td class="py-3.5 px-4 font-bold text-slate-900 whitespace-nowrap">${formatEuro(total)}</td>
                                        <td class="py-3.5 px-4 whitespace-nowrap">
                                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusClass}">${escapeHtml(d.status)}</span>
                                        </td>
                                        <td class="py-3.5 px-4 text-right whitespace-nowrap space-x-1">
                                            ${d.type === 'devis' && d.status !== 'Converti' ? `<button onclick="convertQuoteToInvoice('${d.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-50 hover:bg-indigo-100 text-indigo-700">→ Facture</button>` : ''}
                                            ${d.type === 'facture' && d.status !== 'Payée' ? `<button onclick="markInvoicePaid('${d.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 text-emerald-700">Marquer payée</button>` : ''}
                                            <button onclick="openDocPreviewModal('${d.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">Aperçu / PDF</button>
                                            ${isAdmin() ? `<button onclick="requestDeleteDoc('${d.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50" title="Supprimer"><svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>` : ''}
                                        </td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function openDocModal(docType = 'devis') {
            const activeClients = state.data.clients.filter(c => !c.anonymized);
            if (!activeClients.length) {
                showToast('Ajoutez d\'abord un client actif dans le CRM.', 'warning');
                return;
            }
            docItemsDraft = [{ description: '', qty: 1, unitPrice: 0 }];

            openModal(docType === 'devis' ? 'Créer un devis informel' : 'Créer une facture informelle', `
                <form id="doc-form" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Client *</label>
                            <select name="clientId" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                ${activeClients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Date *</label>
                            <input type="date" name="date" required value="${offsetDate(0)}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                    </div>

                    <!-- Ajout rapide depuis le catalogue -->
                    <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row gap-2">
                        <select id="quick-add-product-select" class="flex-1 px-3 py-1.5 text-xs rounded-lg border border-slate-300 bg-white">
                            <option value="">— Ajouter rapidement un produit du catalogue —</option>
                            ${state.data.products.map(p => `<option value="${p.id}">${escapeHtml(p.name)} (${formatEuro(p.price)})</option>`).join('')}
                        </select>
                        <button type="button" onclick="quickAddProductToDoc()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold shrink-0">+ Ajouter</button>
                    </div>

                    <!-- Lignes du document -->
                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-700">Lignes / Prestations</span>
                            <button type="button" onclick="addEmptyDocLine()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">+ Ligne libre</button>
                        </div>
                        <div id="doc-lines-wrap" class="space-y-2"></div>
                        <div class="text-right pt-2 border-t border-slate-100">
                            <span class="text-xs text-slate-500 mr-2">Total estimé :</span>
                            <span id="doc-draft-total" class="text-lg font-bold text-slate-900">0,00 €</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Notes / Conditions</label>
                        <textarea name="notes" rows="2" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300" placeholder="Délai de livraison, validité..."></textarea>
                    </div>

                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100">Annuler</button>
                        <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700">Enregistrer</button>
                    </div>
                </form>
            `);

            renderDocLinesDraft();

            document.getElementById('doc-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const validItems = docItemsDraft.filter(i => (i.description || '').trim() && i.qty > 0);
                if (!validItems.length) {
                    showToast('Ajoutez au moins une ligne avec une désignation.', 'warning');
                    return;
                }
                const fd = new FormData(e.target);
                const prefix = docType === 'devis' ? 'DEV-2026' : 'FAC-2026';
                const newDoc = {
                    id: `${prefix}-${String(Math.floor(100 + Math.random() * 899))}`,
                    type: docType,
                    clientId: fd.get('clientId'),
                    date: fd.get('date'),
                    status: 'En attente',
                    pointsCredited: false,
                    notes: fd.get('notes').trim(),
                    items: validItems
                };
                state.data.documents.unshift(newDoc);
                const cl = getClientById(newDoc.clientId);
                addLog('Facturation', `${docType === 'devis' ? 'Devis' : 'Facture'} ${newDoc.id} créé(e) pour ${cl ? cl.name : ''} (${formatEuro(calcDocTotal(newDoc))}).`);
                saveData();
                closeModal();
                renderCurrentSection();
                showToast(`${docType === 'devis' ? 'Devis' : 'Facture'} créé(e) avec succès.`, 'success');
            });
        }

        function renderDocLinesDraft() {
            const wrap = document.getElementById('doc-lines-wrap');
            if (!wrap) return;
            wrap.innerHTML = docItemsDraft.map((item, idx) => `
                <div class="grid grid-cols-12 gap-2 items-center">
                    <input type="text" value="${escapeHtml(item.description)}" oninput="docItemsDraft[${idx}].description=this.value" placeholder="Désignation" class="col-span-6 px-3 py-1.5 text-xs rounded-lg border border-slate-300">
                    <input type="number" min="1" value="${item.qty}" oninput="docItemsDraft[${idx}].qty=Number(this.value)||1; updateDocDraftTotal()" class="col-span-2 px-2 py-1.5 text-xs rounded-lg border border-slate-300 text-center">
                    <input type="number" min="0" step="0.01" value="${item.unitPrice}" oninput="docItemsDraft[${idx}].unitPrice=Number(this.value)||0; updateDocDraftTotal()" class="col-span-3 px-2 py-1.5 text-xs rounded-lg border border-slate-300 text-right">
                    <button type="button" onclick="removeDocLine(${idx})" class="col-span-1 p-1 text-slate-400 hover:text-rose-600 text-center">✕</button>
                </div>
            `).join('');
            updateDocDraftTotal();
        }

        function updateDocDraftTotal() {
            const totalEl = document.getElementById('doc-draft-total');
            if (!totalEl) return;
            const total = docItemsDraft.reduce((s, i) => s + (Number(i.qty) || 0) * (Number(i.unitPrice) || 0), 0);
            totalEl.textContent = formatEuro(total);
        }

        function addEmptyDocLine() {
            docItemsDraft.push({ description: '', qty: 1, unitPrice: 0 });
            renderDocLinesDraft();
        }

        function removeDocLine(idx) {
            if (docItemsDraft.length <= 1) return;
            docItemsDraft.splice(idx, 1);
            renderDocLinesDraft();
        }

        function quickAddProductToDoc() {
            const sel = document.getElementById('quick-add-product-select');
            const prod = state.data.products.find(p => p.id === sel.value);
            if (!prod) return;
            if (docItemsDraft.length === 1 && !docItemsDraft[0].description) {
                docItemsDraft[0] = { description: prod.name, qty: 1, unitPrice: prod.price };
            } else {
                docItemsDraft.push({ description: prod.name, qty: 1, unitPrice: prod.price });
            }
            sel.value = '';
            renderDocLinesDraft();
        }

        function convertQuoteToInvoice(docId) {
            const q = state.data.documents.find(d => d.id === docId);
            if (!q) return;
            q.status = 'Converti';
            const inv = {
                id: `FAC-2026-${String(Math.floor(100 + Math.random() * 899))}`,
                type: 'facture',
                clientId: q.clientId,
                date: offsetDate(0),
                status: 'En attente',
                pointsCredited: false,
                notes: `Convertie depuis le devis ${q.id}. ${q.notes || ''}`.trim(),
                items: JSON.parse(JSON.stringify(q.items))
            };
            state.data.documents.unshift(inv);
            addLog('Facturation', `Devis ${q.id} converti en facture ${inv.id}.`);
            saveData();
            renderCurrentSection();
            showToast(`Facture ${inv.id} créée depuis le devis ${q.id} !`, 'success');
        }

        function markInvoicePaid(docId) {
            const doc = state.data.documents.find(d => d.id === docId);
            if (!doc || doc.status === 'Payée') return;
            doc.status = 'Payée';
            let ptsMsg = '';
            const cl = getClientById(doc.clientId);
            if (cl && !cl.anonymized && !doc.pointsCredited) {
                const earned = Math.floor(calcDocTotal(doc) / 10);
                cl.points = (cl.points || 0) + earned;
                doc.pointsCredited = true;
                ptsMsg = ` (+${earned} pts fidélité crédités à ${cl.name})`;
            }
            addLog('Facturation', `Facture ${doc.id} marquée Payée${ptsMsg}.`);
            saveData();
            renderCurrentSection();
            showToast(`Facture payée${ptsMsg} !`, 'success');
        }

        function requestDeleteDoc(docId) {
            if (!isAdmin()) return;
            openConfirm({
                title: 'Supprimer ce document ?',
                message: `Le document ${docId} sera supprimé définitivement.`,
                confirmLabel: 'Supprimer',
                onConfirm: () => {
                    state.data.documents = state.data.documents.filter(d => d.id !== docId);
                    addLog('Facturation', `Document supprimé : ${docId}.`);
                    saveData();
                    renderCurrentSection();
                    showToast('Document supprimé.', 'info');
                }
            });
        }

        function openDocPreviewModal(docId) {
            const doc = state.data.documents.find(d => d.id === docId);
            if (!doc) return;
            const client = getClientById(doc.clientId);
            const total = calcDocTotal(doc);
            const docLabel = doc.type === 'devis' ? 'DEVIS INFORMEL' : 'FACTURE INFORMELLE';

            const plainText = [
                `STAR DESIGN — ${docLabel} ${doc.id}`,
                `Date : ${formatDateFR(doc.date)}`,
                `Client : ${client ? client.name : 'Client inconnu'}`,
                '----------------------------------------',
                ...doc.items.map(i => `• ${i.description} (x${i.qty}) : ${formatEuro(i.qty * i.unitPrice)}`),
                '----------------------------------------',
                `TOTAL : ${formatEuro(total)}`,
                doc.notes ? `Note : ${doc.notes}` : ''
            ].filter(Boolean).join('\n');

            openModal(`Aperçu — ${doc.id}`, `
                <div id="printable-document" class="bg-white p-5 rounded-2xl border border-slate-200">
                    <div class="flex items-start justify-between border-b border-slate-200 pb-4 mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center shrink-0">
                                ${getStarDesignLogoInlineSVG('w-7 h-7')}
                            </div>
                            <div>
                                <div class="text-base font-bold tracking-[0.12em] text-slate-900">STAR DESIGN</div>
                                <div class="text-[11px] text-slate-500">Studio Design & Mobilier — Document informel</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-bold text-indigo-700">${docLabel}</div>
                            <div class="text-xs font-mono text-slate-500">${escapeHtml(doc.id)}</div>
                            <div class="text-xs text-slate-500">${formatDateFR(doc.date)}</div>
                        </div>
                    </div>
                    <div class="mb-4 p-3 rounded-xl bg-slate-50 text-xs">
                        <div class="font-bold text-slate-900">${escapeHtml(client ? client.name : 'Client inconnu')}</div>
                        <div class="text-slate-600">${escapeHtml(client ? client.email : '')} • ${escapeHtml(client ? client.phone : '')}</div>
                    </div>
                    <table class="w-full text-left text-xs mb-4">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-500 uppercase">
                                <th class="py-2">Désignation</th>
                                <th class="py-2 text-center">Qté</th>
                                <th class="py-2 text-right">P.U.</th>
                                <th class="py-2 text-right">Total</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${doc.items.map(i => `
                                <tr>
                                    <td class="py-2 font-medium text-slate-800">${escapeHtml(i.description)}</td>
                                    <td class="py-2 text-center">${i.qty}</td>
                                    <td class="py-2 text-right">${formatEuro(i.unitPrice)}</td>
                                    <td class="py-2 text-right font-semibold">${formatEuro(i.qty * i.unitPrice)}</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                    <div class="flex justify-end border-t border-slate-200 pt-3">
                        <div class="text-right">
                            <span class="text-xs uppercase text-slate-500 mr-2">Total</span>
                            <span class="text-xl font-bold text-slate-900">${formatEuro(total)}</span>
                        </div>
                    </div>
                    ${doc.notes ? `<div class="mt-3 pt-3 border-t border-slate-100 text-xs text-slate-500 italic">${escapeHtml(doc.notes)}</div>` : ''}
                </div>
                <div class="no-print mt-4 flex justify-end gap-2">
                    <button id="copy-doc-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 text-slate-800">Copier le récapitulatif</button>
                    <button onclick="window.print()" class="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">Imprimer / PDF</button>
                </div>
            `);
            document.getElementById('copy-doc-btn').addEventListener('click', () => copyToClipboard(plainText, 'Récapitulatif copié !'));
        }

        /* ============================================================================
         * MODULE 4 : STOCK & VITRINE SITE WEB (AVEC MULTI-PHOTOS PAR ANNONCE)
         * ============================================================================ */

                state.inventoryTab = 'storefront';

                ? state.data.products.filter(p => p.stock <= p.threshold)
                : state.data.products;

            const storefrontProducts = state.data.products.filter(p => p.status === 'En ligne' || p.status === 'Rupture de stock');

                                Gestion Stock & Annonces (${state.data.products.length})
                            </button>
                        ` : ''}

                            <input type="checkbox" ${state.inventoryOnlyLowStock ? 'checked' : ''} onchange="state.inventoryOnlyLowStock=this.checked; renderCurrentSection()" class="rounded text-rose-600">
                            Alertes stock bas uniquement
                        </label>
                    ` : ''}
                </div>

                ${state.inventoryTab === 'manage' && canManage ? `
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-100 bg-slate-50/70 text-[11px] font-semibold uppercase tracking-wider text-slate-500">

                                        <th class="py-3.5 px-4">Prix</th>
                                        <th class="py-3.5 px-4">Stock</th>
                                        <th class="py-3.5 px-4">Statut Annonce</th>
                                        <th class="py-3.5 px-4 text-center">À la une</th>
                                        <th class="py-3.5 px-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${products.length === 0 ? `<tr><td colspan="6" class="py-10 text-center text-slate-500 text-xs">Aucun produit correspondant.</td></tr>` : products.map(p => {
                                        const photos = p.photos || [];

        }

        function cycleCardPhoto(prodId, step) {
            const p = state.data.products.find(x => x.id === prodId);
            if (!p || !p.photos || p.photos.length < 2) return;
            const cur = state.cardPhotoIndex[prodId] || 0;
            state.cardPhotoIndex[prodId] = (cur + step + p.photos.length) % p.photos.length;
            renderCurrentSection();
        }

        function openStorefrontProductModal(prodId, startIndex = 0) {
            const p = state.data.products.find(x => x.id === prodId);
            if (!p) return;
            lightboxState = { productId: prodId, index: startIndex };

        function renderLightboxModalContent() {
            const p = state.data.products.find(x => x.id === lightboxState.productId);
            if (!p) return;
            const photos = (p.photos && p.photos.length) ? p.photos : [{ url: FALLBACK_IMG, caption: p.name }];

            openModal(`Fiche Produit Vitrine — ${p.name}`, `
                <div class="space-y-5">
                    <div class="relative rounded-2xl overflow-hidden bg-slate-900 aspect-[16/10] flex items-center justify-center">
