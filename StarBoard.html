                            <input type="number" name="stock" min="0" required value="${prod ? prod.stock : 5}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Seuil d'alerte *</label>
                            <input type="number" name="threshold" min="0" required value="${prod ? prod.threshold : 2}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Description vitrine</label>
                        <textarea name="description" rows="2" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none" placeholder="Matériaux, dimensions, finitions...">${escapeHtml(prod?.description || '')}</textarea>
                    </div>

                    <!-- ZONE MULTI-PHOTOS -->
                    <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                                <div class="text-xs font-bold text-slate-800">Galerie photos de l'annonce</div>
                                <div class="text-[11px] text-slate-500">La 1re photo (★) est utilisée comme couverture sur la vitrine.</div>
                            </div>
                            <label class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold transition shrink-0">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                                Importer des photos
                                <input type="file" id="product-photo-files" accept="image/*" multiple class="hidden" onchange="handleProductPhotoFiles(this.files)">
                            </label>
                        </div>

                        <!-- Ajout via URL -->
                        <div class="flex gap-2">
                            <input type="url" id="product-photo-url-input" placeholder="Ou coller une URL d'image (https://...)" class="flex-1 px-3 py-1.5 text-xs rounded-xl border border-slate-300 bg-white outline-none focus:border-indigo-500">
                            <button type="button" onclick="addProductPhotoByUrl()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold shrink-0">Ajouter URL</button>
                        </div>

                        <!-- Miniatures -->
                        <div id="product-photos-gallery" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5"></div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Statut de l'annonce</label>
                            <select name="status" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                <option value="Brouillon" ${prod?.status === 'Brouillon' ? 'selected' : ''}>Brouillon</option>
                                <option value="En ligne" ${!prod || prod.status === 'En ligne' ? 'selected' : ''}>En ligne</option>
                                <option value="Rupture de stock" ${prod?.status === 'Rupture de stock' ? 'selected' : ''}>Rupture de stock</option>
                            </select>
                        </div>
                        <label class="flex items-center gap-2.5 text-sm font-medium text-slate-700 mt-3 sm:mt-4 cursor-pointer">
                            <input type="checkbox" name="featured" ${prod?.featured ? 'checked' : ''} class="w-4 h-4 rounded text-amber-500">
                            Mettre « À la une » sur la vitrine
                        </label>
                    </div>

                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100">Annuler</button>
                        <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700">${isEdit ? 'Enregistrer' : 'Publier / Créer'}</button>
                    </div>
                </form>
            `, 'max-w-3xl');

            renderEditingPhotosGallery();

            document.getElementById('product-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const stock = Math.max(0, parseInt(fd.get('stock'), 10) || 0);
                let status = fd.get('status');
                if (stock === 0) status = 'Rupture de stock';

                const payload = {
                    name: fd.get('name').trim(),
                    category: fd.get('category').trim(),
                    price: parseFloat(fd.get('price')) || 0,
                    stock,
                    threshold: Math.max(0, parseInt(fd.get('threshold'), 10) || 0),
                    description: fd.get('description').trim(),
                    status,
                    featured: !!fd.get('featured'),
                    photos: JSON.parse(JSON.stringify(editingPhotos))
                };

                if (isEdit) {
                    Object.assign(prod, payload);
                    addLog('Vitrine', `Annonce "${prod.name}" mise à jour (${prod.photos.length} photo(s), stock : ${prod.stock}).`);
                } else {
                    const newProd = { id: generateId('PRD'), ...payload };
                    state.data.products.unshift(newProd);
                    addLog('Vitrine', `Nouvelle annonce "${newProd.name}" créée avec ${newProd.photos.length} photo(s).`);
                }
                saveData();
                closeModal();
                renderCurrentSection();
                showToast(isEdit ? 'Annonce mise à jour.' : 'Annonce créée avec succès.', 'success');
            });
        }

        async function handleProductPhotoFiles(fileList) {
            if (!fileList || !fileList.length) return;
            let added = 0;
            for (const file of Array.from(fileList)) {
                if (!file.type.startsWith('image/')) continue;
                try {
                    const compressedDataUrl = await compressImageFile(file);
                    editingPhotos.push({ url: compressedDataUrl, caption: file.name.replace(/\.[^.]+$/, '') });
                    added++;
                } catch (err) {
                    showToast(`Impossible de traiter ${file.name}.`, 'error');
                }
            }
            const input = document.getElementById('product-photo-files');
            if (input) input.value = '';
            if (added > 0) {
                renderEditingPhotosGallery();
                showToast(`${added} photo(s) compressée(s) et ajoutée(s).`, 'success');
            }
        }

        function addProductPhotoByUrl() {
            const input = document.getElementById('product-photo-url-input');
            const url = (input.value || '').trim();
            if (!url || !/^https?:\/\//i.test(url)) {
                showToast('Veuillez saisir une URL valide (http:// ou https://).', 'warning');
                return;
            }
            editingPhotos.push({ url, caption: `Photo ${editingPhotos.length + 1}` });
            input.value = '';
            renderEditingPhotosGallery();
            showToast('Photo ajoutée depuis l\'URL.', 'success');
        }

        function setCoverPhoto(index) {
            if (index <= 0 || index >= editingPhotos.length) return;
            const [selected] = editingPhotos.splice(index, 1);
            editingPhotos.unshift(selected);
            renderEditingPhotosGallery();
        }

        function moveEditingPhoto(index, dir) {
            const target = index + dir;
            if (target < 0 || target >= editingPhotos.length) return;
            [editingPhotos[index], editingPhotos[target]] = [editingPhotos[target], editingPhotos[index]];
            renderEditingPhotosGallery();
        }

        function removeEditingPhoto(index) {
            editingPhotos.splice(index, 1);
            renderEditingPhotosGallery();
        }

        function renderEditingPhotosGallery() {
            const wrap = document.getElementById('product-photos-gallery');
            if (!wrap) return;
            if (!editingPhotos.length) {
                wrap.innerHTML = `<div class="col-span-full py-5 text-center text-xs text-slate-400 border border-dashed border-slate-300 rounded-xl bg-white">Aucune photo ajoutée. Importez des images ou collez une URL.</div>`;
                return;
            }
            wrap.innerHTML = editingPhotos.map((ph, idx) => `
                <div class="relative rounded-xl overflow-hidden border ${idx === 0 ? 'border-amber-400 ring-2 ring-amber-200' : 'border-slate-200'} bg-white flex flex-col">
                    <div class="relative h-24 bg-slate-100">
                        <img src="${escapeHtml(ph.url)}" onerror="this.src='${FALLBACK_IMG}'" alt="" class="w-full h-full object-cover">
                        ${idx === 0 ? `<span class="absolute top-1 left-1 px-1.5 py-0.5 rounded-md bg-amber-400 text-slate-950 text-[9px] font-bold uppercase">★ Principale</span>` : ''}
                    </div>
                    <div class="p-1.5 flex items-center justify-between gap-1 bg-white border-t border-slate-100">
                        <button type="button" onclick="setCoverPhoto(${idx})" class="p-1 rounded-lg text-xs ${idx === 0 ? 'text-amber-500' : 'text-slate-400 hover:text-amber-500 hover:bg-amber-50'}" title="Définir comme photo principale">★</button>
                        <div class="flex items-center gap-0.5">
                            <button type="button" onclick="moveEditingPhoto(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} class="px-1.5 py-0.5 rounded text-xs text-slate-500 hover:bg-slate-100 disabled:opacity-30" title="Déplacer à gauche">←</button>
                            <button type="button" onclick="moveEditingPhoto(${idx}, 1)" ${idx === editingPhotos.length - 1 ? 'disabled' : ''} class="px-1.5 py-0.5 rounded text-xs text-slate-500 hover:bg-slate-100 disabled:opacity-30" title="Déplacer à droite">→</button>
                        </div>
                        <button type="button" onclick="removeEditingPhoto(${idx})" class="p-1 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 text-xs" title="Supprimer">✕</button>
                    </div>
                </div>
            `).join('');
        }

        function changeProductStock(prodId, delta) {
            const p = state.data.products.find(x => x.id === prodId);
            if (!p) return;
            const prev = p.stock;
            p.stock = Math.max(0, p.stock + delta);
            if (p.stock === prev) return;

            let suffix = '';
            if (p.stock === 0 && p.status !== 'Rupture de stock') {
                p.status = 'Rupture de stock';
                suffix = ' — passage automatique en "Rupture de stock"';
                showToast(`"${p.name}" est passé en Rupture de stock.`, 'warning');
            } else if (prev === 0 && p.stock > 0 && p.status === 'Rupture de stock') {
                p.status = 'En ligne';
                suffix = ' — annonce réactivée "En ligne"';
            }
            addLog('Stock', `Stock de "${p.name}" : ${prev} → ${p.stock}${suffix}.`);
            saveData();
            renderCurrentSection();
        }

        function changeProductStatus(prodId, newStatus) {
            const p = state.data.products.find(x => x.id === prodId);
            if (!p) return;
            if (newStatus === 'En ligne' && p.stock === 0) {
                showToast('Stock à 0 : réapprovisionnez avant de mettre en ligne.', 'error');
                renderCurrentSection();
                return;
            }
            p.status = newStatus;
            addLog('Vitrine', `Statut d'annonce de "${p.name}" : ${newStatus}.`);
            saveData();
            renderCurrentSection();
        }

        function toggleProductFeatured(prodId) {
            const p = state.data.products.find(x => x.id === prodId);
            if (!p) return;
            p.featured = !p.featured;
            addLog('Vitrine', `"${p.name}" ${p.featured ? 'mis À la une' : 'retiré de la une'}.`);
            saveData();
            renderCurrentSection();
        }

        function requestDeleteProduct(prodId) {
            if (!isAdmin()) return;
            const p = state.data.products.find(x => x.id === prodId);
            if (!p) return;
            openConfirm({
                title: 'Supprimer ce produit ?',
                message: `"${p.name}" et ses ${(p.photos || []).length} photo(s) seront supprimés.`,
                confirmLabel: 'Supprimer',
                onConfirm: () => {
                    state.data.products = state.data.products.filter(x => x.id !== prodId);
                    addLog('Stock', `Annonce produit supprimée : "${p.name}".`);
                    saveData();
                    renderCurrentSection();
                    showToast('Produit supprimé.', 'info');
                }
            });
        }

        /* ============================================================================
         * MODULE 5 : EMPLOIS DU TEMPS (CALENDRIER INTERACTIF & EXPORT .ICS)
         * ============================================================================ */
        function getFilteredScheduleEvents() {
            const effectiveEmpFilter = isAdmin() ? state.scheduleEmployeeFilter : state.connectedEmployeeId;
            return state.data.scheduleEvents.filter(ev =>
                effectiveEmpFilter === 'ALL' ? true : ev.employeeId === effectiveEmpFilter
            );
        }

        function renderSchedule(container) {
            const connectedEmp = getEmployeeById(state.connectedEmployeeId);
            const effectiveEmpFilter = isAdmin() ? state.scheduleEmployeeFilter : state.connectedEmployeeId;
            const events = getFilteredScheduleEvents();

            const mondayIso = getMondayOfWeek(state.calendarAnchorDate);
            const sundayIso = offsetDate(6, mondayIso);
            const anchorDateObj = parseISODate(state.calendarAnchorDate);
            const monthLabel = anchorDateObj.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
            const rangeTitle = state.calendarView === 'week'
                ? `Semaine du ${formatDateFR(mondayIso, { day: 'numeric', month: 'short' })} au ${formatDateFR(sundayIso, { day: 'numeric', month: 'short', year: 'numeric' })}`
                : monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1);

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Emplois du temps & Calendrier</h1>
                        <p class="text-sm text-slate-500 mt-0.5">
                            ${isAdmin()
                                ? 'Mode Admin : gérez les horaires de travail (bleu/indigo) et les RDV (émeraude/ambre) de toute l\'équipe.'
                                : `Mode Employé (${escapeHtml(connectedEmp ? connectedEmp.name : '')}) : consultez vos horaires de travail et gérez vos RDV.`}
                        </p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        ${isAdmin() ? `
                            <button onclick="openScheduleEventModal('work_shift')" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold shadow-xs transition">
                                + Horaire de travail
                            </button>
                        ` : ''}
                        <button onclick="openScheduleEventModal('appointment')" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold shadow-xs transition">
                            + Ajouter un RDV
                        </button>
                    </div>
                </div>

                <!-- Barre de contrôle : Sous-onglets + Filtre Employé + Export .ics -->
                <div class="bg-white rounded-2xl border border-slate-200 p-3 mb-5 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                    <div class="flex flex-wrap items-center gap-2">
                        <button onclick="state.scheduleTab='calendar'; renderCurrentSection()" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition ${state.scheduleTab === 'calendar' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                            Calendrier interactif
                        </button>
                        <button onclick="state.scheduleTab='leaves'; renderCurrentSection()" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition ${state.scheduleTab === 'leaves' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                            Disponibilités / Absences (${state.data.leaves.length})
                        </button>

                        ${state.scheduleTab === 'calendar' ? `
                            <div class="h-5 w-px bg-slate-200 mx-1 hidden sm:block"></div>
                            <div class="inline-flex bg-slate-100 p-0.5 rounded-xl">
                                <button onclick="state.calendarView='week'; renderCurrentSection()" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${state.calendarView === 'week' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}">Semaine</button>
                                <button onclick="state.calendarView='month'; renderCurrentSection()" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${state.calendarView === 'month' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}">Mois</button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        ${isAdmin() ? `
                            <select onchange="state.scheduleEmployeeFilter=this.value; renderCurrentSection()" class="text-xs font-semibold text-slate-700 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 outline-none">
                                <option value="ALL" ${effectiveEmpFilter === 'ALL' ? 'selected' : ''}>Toute l'équipe</option>
                                ${state.data.employees.map(emp => `<option value="${emp.id}" ${effectiveEmpFilter === emp.id ? 'selected' : ''}>${escapeHtml(emp.name)}</option>`).join('')}
                            </select>
                        ` : `
                            <span class="px-3 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold">
                                EDT verrouillé : ${escapeHtml(connectedEmp ? connectedEmp.name : '')}
                            </span>
                        `}

                        <button onclick="exportScheduleICS()" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            Exporter .ics
                        </button>
                    </div>
                </div>

                ${state.scheduleTab === 'calendar' ? `
                    <!-- Barre de navigation temporelle + Légende -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                        <div class="flex items-center gap-2">
                            <button onclick="shiftCalendarPeriod(-1)" class="px-3 py-1.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-xs font-semibold text-slate-700">← Précédent</button>
                            <button onclick="state.calendarAnchorDate=offsetDate(0); renderCurrentSection()" class="px-3 py-1.5 rounded-xl bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 text-xs font-semibold text-indigo-700">Aujourd'hui</button>
                            <button onclick="shiftCalendarPeriod(1)" class="px-3 py-1.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-xs font-semibold text-slate-700">Suivant →</button>
                            <span class="text-sm font-bold text-slate-900 ml-1">${escapeHtml(rangeTitle)}</span>
                        </div>
                        <div class="flex items-center gap-3 text-xs font-medium text-slate-600">
                            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-indigo-500/20 border-l-4 border-indigo-600"></span>Horaire de travail</span>
                            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-500/20 border-l-4 border-emerald-600"></span>Rendez-vous (RDV)</span>
                        </div>
                    </div>

                    ${state.calendarView === 'week' ? renderWeeklyCalendarHTML(mondayIso, events) : renderMonthlyCalendarHTML(state.calendarAnchorDate, events)}
                ` : renderLeavesSubtabHTML()}
            `;
        }

        function shiftCalendarPeriod(step) {
            const d = parseISODate(state.calendarAnchorDate);
            if (state.calendarView === 'week') {
                d.setDate(d.getDate() + step * 7);
            } else {
                d.setMonth(d.getMonth() + step);
            }
            state.calendarAnchorDate = toISODate(d);
            renderCurrentSection();
        }

        // Grille Hebdomadaire interactive (08h00 - 20h00, Lundi -> Dimanche)
        function renderWeeklyCalendarHTML(mondayIso, events) {
            const START_HOUR = 8;
            const END_HOUR = 20;
            const HOUR_HEIGHT = 58; // px par heure
            const TOTAL_HEIGHT = (END_HOUR - START_HOUR) * HOUR_HEIGHT;
            const today = offsetDate(0);
            const dayNames = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
            const days = Array.from({ length: 7 }, (_, i) => offsetDate(i, mondayIso));

            const hoursLabels = Array.from({ length: END_HOUR - START_HOUR }, (_, i) => {
                const h = START_HOUR + i;
                return `<div style="height:${HOUR_HEIGHT}px" class="pr-2 text-right text-[11px] font-medium text-slate-400 -mt-2">${String(h).padStart(2, '0')}:00</div>`;
            }).join('');

            const dayColumns = days.map((isoDate, idx) => {
                const isToday = isoDate === today;
                const dObj = parseISODate(isoDate);
                const dayEvents = events.filter(e => e.date === isoDate);
                const shifts = dayEvents.filter(e => e.type === 'work_shift');
                const rdvs = dayEvents.filter(e => e.type === 'appointment');

                // Cellules horaires cliquables
                const hourSlots = Array.from({ length: END_HOUR - START_HOUR }, (_, i) => {
                    const hStr = `${String(START_HOUR + i).padStart(2, '0')}:00`;
                    const defaultType = isAdmin() ? 'work_shift' : 'appointment';
                    return `<div onclick="openScheduleEventModal('${defaultType}', null, '${isoDate}', '${hStr}')" style="height:${HOUR_HEIGHT}px" class="border-b border-slate-100 hover:bg-indigo-50/40 cursor-pointer transition" title="Cliquer pour ajouter (${defaultType === 'work_shift' ? 'Horaire' : 'RDV'}) à ${hStr}"></div>`;
                }).join('');

                // Rendu des Horaires de travail (blocs indigo en arrière-plan/gauche)
                const shiftsHTML = shifts.map((ev, sIdx) => {
                    const startM = Math.max(START_HOUR * 60, timeToMinutes(ev.startTime));
                    const endM = Math.min(END_HOUR * 60, timeToMinutes(ev.endTime));
                    const top = ((startM - START_HOUR * 60) / 60) * HOUR_HEIGHT;
                    const height = Math.max(26, ((endM - startM) / 60) * HOUR_HEIGHT);
                    const emp = getEmployeeById(ev.employeeId);
                    const widthPct = shifts.length > 1 ? Math.floor(96 / shifts.length) : 96;
                    const leftPct = 2 + sIdx * widthPct;

                    return `
                        <div onclick="event.stopPropagation(); handleCalendarEventClick('${ev.id}')"
                             style="top:${top}px; height:${height}px; left:${leftPct}%; width:${widthPct - 1}%;"
                             class="absolute z-10 rounded-xl bg-indigo-50/95 border border-indigo-200 border-l-4 border-l-indigo-600 p-1.5 overflow-hidden cursor-pointer hover:bg-indigo-100/90 transition shadow-2xs ${state.highlightId === ev.id ? 'ring-2 ring-amber-400' : ''}">
                            <div class="text-[10px] font-bold text-indigo-800 leading-tight truncate">${escapeHtml(emp ? emp.name.split(' ')[0] : '')} • ${ev.startTime}-${ev.endTime}</div>
                            <div class="text-[10px] text-indigo-600 truncate">${escapeHtml(ev.title)}</div>
                            ${!isAdmin() ? `<span class="text-[9px] text-indigo-400 font-medium">Lecture seule</span>` : ''}
                        </div>`;
                }).join('');

                // Rendu des Rendez-vous (blocs émeraude/ambre au premier plan, décalés proprement pour ne pas masquer les horaires)
                const rdvsHTML = rdvs.map((ev) => {
                    const startM = Math.max(START_HOUR * 60, timeToMinutes(ev.startTime));
                    const endM = Math.min(END_HOUR * 60, timeToMinutes(ev.endTime));
                    const top = ((startM - START_HOUR * 60) / 60) * HOUR_HEIGHT;
                    const height = Math.max(32, ((endM - startM) / 60) * HOUR_HEIGHT);
                    const emp = getEmployeeById(ev.employeeId);
                    const leftOffset = shifts.length > 0 ? 'left-[18%] right-1' : 'left-1 right-1';

                    return `
                        <div onclick="event.stopPropagation(); handleCalendarEventClick('${ev.id}')"
                             style="top:${top}px; height:${height}px;"
                             class="absolute ${leftOffset} z-20 rounded-xl bg-emerald-600 text-white border border-emerald-500 border-l-4 border-l-amber-300 p-1.5 overflow-hidden cursor-pointer hover:bg-emerald-700 transition shadow-md ${state.highlightId === ev.id ? 'ring-2 ring-amber-400' : ''}">
                            <div class="text-[10px] font-bold leading-tight truncate">${ev.startTime}-${ev.endTime} • RDV</div>
                            <div class="text-[10px] text-emerald-50 font-medium truncate">${escapeHtml(ev.title)}</div>

                return `
                    <div class="flex-1 min-w-[130px] border-r border-slate-100 last:border-r-0 ${isToday ? 'bg-indigo-50/20' : 'bg-white'}">
                        <div class="sticky top-0 z-30 h-14 px-2 flex flex-col items-center justify-center border-b border-slate-200 ${isToday ? 'bg-indigo-600 text-white' : 'bg-slate-50 text-slate-700'}">

                        </div>
                        <div class="relative" style="height:${TOTAL_HEIGHT}px">
                            ${hourSlots}
                            ${shiftsHTML}
                            ${rdvsHTML}
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <div class="overflow-x-auto">
                        <div class="flex min-w-[960px]">
                            <!-- Colonne des heures -->
                            <div class="w-14 shrink-0 border-r border-slate-200 bg-slate-50/70">
                                <div class="h-14 border-b border-slate-200 flex items-center justify-center text-[10px] font-bold text-slate-400 uppercase">Heure</div>
                                <div class="pt-2" style="height:${TOTAL_HEIGHT}px">${hoursLabels}</div>
                            </div>
                            <!-- 7 Colonnes jours -->
                            <div class="flex flex-1">${dayColumns}</div>
                        </div>
                    </div>
                    <div class="px-4 py-2.5 bg-slate-50 border-t border-slate-100 text-[11px] text-slate-500 flex items-center justify-between flex-wrap gap-2">
                        <span>Astuce : cliquez sur un créneau vide pour ajouter ${isAdmin() ? 'un horaire de travail' : 'un rendez-vous'}, ou cliquez sur un bloc existant pour le consulter / modifier.</span>
                    </div>
                </div>
            `;
        }

        // Vue Mensuelle synthétique
        function renderMonthlyCalendarHTML(anchorIso, events) {
            const d = parseISODate(anchorIso);
            const year = d.getFullYear();
            const month = d.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startOffset = (firstDay.getDay() + 6) % 7; // 0 = Lundi
            const today = offsetDate(0);

            const cells = [];
            for (let i = 0; i < startOffset; i++) {
                cells.push(`<div class="min-h-[104px] bg-slate-50/60 border-b border-r border-slate-100"></div>`);
            }
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const iso = toISODate(new Date(year, month, day));
                const isToday = iso === today;
                const dayEvents = events.filter(e => e.date === iso).sort((a, b) => a.startTime.localeCompare(b.startTime));
                const defaultType = isAdmin() ? 'work_shift' : 'appointment';

                cells.push(`
                    <div onclick="openScheduleEventModal('${defaultType}', null, '${iso}', '09:00')" class="min-h-[104px] p-2 border-b border-r border-slate-100 cursor-pointer hover:bg-indigo-50/30 transition ${isToday ? 'bg-indigo-50/40' : 'bg-white'}">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${isToday ? 'bg-indigo-600 text-white' : 'text-slate-700'}">${day}</span>
                            ${dayEvents.length ? `<span class="text-[10px] text-slate-400 font-medium">${dayEvents.length}</span>` : ''}
                        </div>
                        <div class="space-y-1">
                            ${dayEvents.slice(0, 3).map(ev => `
                                <div onclick="event.stopPropagation(); handleCalendarEventClick('${ev.id}')" class="px-1.5 py-0.5 rounded-md text-[10px] font-semibold truncate cursor-pointer ${ev.type === 'appointment' ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200' : 'bg-indigo-100 text-indigo-800 hover:bg-indigo-200'}">
                                    ${ev.startTime} ${escapeHtml(ev.title)}
                                </div>
                            `).join('')}
                            ${dayEvents.length > 3 ? `<div class="text-[10px] font-semibold text-slate-400 pl-1">+${dayEvents.length - 3} autre(s)</div>` : ''}
                        </div>
                    </div>
                `);
            }

            return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <div class="overflow-x-auto">
                        <div class="min-w-[700px]">
                            <div class="grid grid-cols-7 bg-slate-50 border-b border-slate-200 text-center text-[11px] font-bold uppercase text-slate-500 py-2.5">
                                <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
                            </div>
                            <div class="grid grid-cols-7">${cells.join('')}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleCalendarEventClick(eventId) {
            const ev = state.data.scheduleEvents.find(x => x.id === eventId);
            if (!ev) return;

            // En mode Employé : un horaire de travail (work_shift) est strictement en lecture seule
            if (!isAdmin() && ev.type === 'work_shift') {
                const emp = getEmployeeById(ev.employeeId);
                openModal('Détail de l\'horaire de travail (Lecture seule)', `
                    <div class="space-y-3 text-sm">
                        <div class="p-4 rounded-xl bg-indigo-50 border border-indigo-200">
                            <div class="text-xs font-bold uppercase text-indigo-600">Horaire défini par la Direction</div>
                            <div class="text-lg font-bold text-slate-900 mt-1">${escapeHtml(ev.title)}</div>
                            <div class="text-xs text-slate-600 mt-1">${escapeHtml(emp ? emp.name : '')} • ${formatDateFR(ev.date)} de <strong>${ev.startTime}</strong> à <strong>${ev.endTime}</strong></div>
                            ${ev.location ? `<div class="text-xs text-slate-600 mt-1">Lieu : ${escapeHtml(ev.location)}</div>` : ''}
                            ${ev.notes ? `<div class="text-xs text-slate-600 mt-2 italic">${escapeHtml(ev.notes)}</div>` : ''}
                        </div>
                        <p class="text-xs text-slate-500">En mode Employé, vous ne pouvez pas modifier vos horaires de travail. Vous pouvez toutefois ajouter un rendez-vous sur cette journée ou soumettre une demande d'absence.</p>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">Fermer</button>
                            <button onclick="openScheduleEventModal('appointment', null, '${ev.date}', '${ev.startTime}')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white">+ Ajouter un RDV ce jour</button>
                        </div>
                    </div>
                `, 'max-w-lg');
                return;
            }

            // Admin (tout éditer) ou Employé (éditer SES propres RDV)
            openScheduleEventModal(ev.type, ev.id);
        }

        function openScheduleEventModal(eventType, eventId = null, prefillDate = null, prefillStart = null) {
            const existing = eventId ? state.data.scheduleEvents.find(x => x.id === eventId) : null;
            const type = existing ? existing.type : eventType;

            if (!isAdmin() && type === 'work_shift') {
                showToast('Seul le rôle Admin / Direction peut gérer les horaires de travail.', 'warning');

            }

            const isShift = type === 'work_shift';
            const dateVal = existing ? existing.date : (prefillDate || offsetDate(0));
            const startVal = existing ? existing.startTime : (prefillStart || '09:00');
            const defaultEndHour = Math.min(20, parseInt(startVal.split(':')[0], 10) + (isShift ? 8 : 1));
            const endVal = existing ? existing.endTime : `${String(defaultEndHour).padStart(2, '0')}:00`;
            const targetEmpId = existing ? existing.employeeId : (isAdmin() ? (state.scheduleEmployeeFilter !== 'ALL' ? state.scheduleEmployeeFilter : state.data.employees[0].id) : state.connectedEmployeeId);
            const activeClients = state.data.clients.filter(c => !c.anonymized);

            openModal(
                existing ? (isShift ? 'Modifier l\'horaire de travail' : 'Modifier le rendez-vous') : (isShift ? 'Nouvel horaire de travail' : 'Nouveau rendez-vous (RDV)'),

                                <select name="employeeId" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                    ${state.data.employees.map(emp => `<option value="${emp.id}" ${emp.id === targetEmpId ? 'selected' : ''}>${escapeHtml(emp.name)}</option>`).join('')}

                            `}
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">${isShift ? 'Poste / Mission *' : 'Titre du RDV *'}</label>
                            <input type="text" name="title" required value="${escapeHtml(existing?.title || (isShift ? 'Showroom & Conseil' : ''))}" placeholder="${isShift ? 'Ex : Showroom Paris' : 'Ex : RDV Client Mme Dupont'}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Date *</label>
                            <input type="date" name="date" required value="${dateVal}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Heure début *</label>
                            <input type="time" name="startTime" required min="08:00" max="20:00" value="${startVal}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Heure fin *</label>
                            <input type="time" name="endTime" required min="08:00" max="20:00" value="${endVal}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                    </div>

                    ${!isShift ? `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Client CRM associé (optionnel)</label>
                                <select name="clientId" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                    <option value="">— Aucun client lié —</option>
                                    ${activeClients.map(c => `<option value="${c.id}" ${existing?.clientId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Lieu</label>
                                <input type="text" name="location" value="${escapeHtml(existing?.location || 'Showroom Star Design')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                            </div>
                        </div>
                    ` : `
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Lieu</label>
                            <input type="text" name="location" value="${escapeHtml(existing?.location || 'Showroom Star Design')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                    `}

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Notes</label>
                        <textarea name="notes" rows="2" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">${escapeHtml(existing?.notes || '')}</textarea>

                    <div class="flex items-center justify-between pt-2">
                        ${existing ? `
                            <button type="button" onclick="deleteScheduleEvent('${existing.id}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-50 hover:bg-rose-100 text-rose-700 transition">Supprimer</button>
                        ` : '<div></div>'}
                        <div class="flex gap-2">

            document.getElementById('schedule-event-form').addEventListener('submit', (e) => {

                const fd = new FormData(e.target);
                const sTime = fd.get('startTime');
                const eTime = fd.get('endTime');
                if (timeToMinutes(eTime) <= timeToMinutes(sTime)) {
                    showToast('L\'heure de fin doit être postérieure à l\'heure de début.', 'warning');
                    return;
                }

                const payload = {
                    type,
                    employeeId: fd.get('employeeId'),
                    clientId: fd.get('clientId') || null,
                    title: fd.get('title').trim(),
                    date: fd.get('date'),
                    startTime: sTime,
                    endTime: eTime,
                    location: (fd.get('location') || '').trim(),
                    notes: (fd.get('notes') || '').trim()
                };

                const emp = getEmployeeById(payload.employeeId);
                if (existing) {
                    Object.assign(existing, payload);
                    addLog(isShift ? 'Planning' : 'RDV', `${isShift ? 'Horaire' : 'RDV'} modifié pour ${emp ? emp.name : ''} : "${payload.title}" (${formatDateFR(payload.date)} ${sTime}-${eTime}).`);
                } else {
                    const created = { id: generateId(isShift ? 'EVT-S' : 'EVT-R'), ...payload };
                    state.data.scheduleEvents.push(created);

                }
                state.calendarAnchorDate = payload.date;
                saveData();
                closeModal();
                renderCurrentSection();
                showToast(isShift ? 'Horaire de travail enregistré.' : 'Rendez-vous enregistré.', 'success');
            });
        }

        function deleteScheduleEvent(eventId) {
            const ev = state.data.scheduleEvents.find(x => x.id === eventId);
            if (!ev) return;
            if (!isAdmin() && (ev.type === 'work_shift' || ev.employeeId !== state.connectedEmployeeId)) {
                showToast('Permission refusée.', 'error');
                return;
            }
            closeModal();
            openConfirm({
                title: ev.type === 'work_shift' ? 'Supprimer cet horaire ?' : 'Supprimer ce rendez-vous ?',
                message: `"${ev.title}" (${formatDateFR(ev.date)} ${ev.startTime}-${ev.endTime}) sera retiré du calendrier.`,
                confirmLabel: 'Supprimer',
                onConfirm: () => {
                    state.data.scheduleEvents = state.data.scheduleEvents.filter(x => x.id !== eventId);
                    addLog(ev.type === 'work_shift' ? 'Planning' : 'RDV', `Suppression : "${ev.title}" (${formatDateFR(ev.date)}).`);
                    saveData();
                    renderCurrentSection();
                    showToast('Événement supprimé du calendrier.', 'info');
                }
            });
        }

                                    <button onclick="decideLeave('${l.id}', 'Refusée')" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold">Refuser</button>

        function openLeaveModal() {
            openModal('Soumettre une disponibilité / absence', `
                <form id="leave-form" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Employé</label>
                            ${isAdmin() ? `
                                <select name="employeeId" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">

                                </select>
                            ` : `
                                <input type="hidden" name="employeeId" value="${state.connectedEmployeeId}">
                                <input type="text" disabled value="${escapeHtml(getEmployeeById(state.connectedEmployeeId)?.name || '')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-slate-100 text-slate-600 font-semibold">

                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Type *</label>
                            <select name="type" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                <option value="Congé">Congé</option>
                                <option value="Indisponibilité">Indisponibilité</option>
                                <option value="Préférence horaire">Préférence horaire</option>

                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Motif *</label>

            document.getElementById('leave-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);

                state.data.leaves.unshift({

        function decideLeave(leaveId, decision) {
            if (!isAdmin()) return;
            const l = state.data.leaves.find(x => x.id === leaveId);
            if (!l) return;
            l.status = decision;
            const emp = getEmployeeById(l.employeeId);
            addLog('Planning', `Demande d'absence de ${emp ? emp.name : ''} (${formatDateFR(l.date)}) : ${decision}.`);
            saveData();
            renderCurrentSection();
            showToast(`Demande ${decision.toLowerCase()}.`, decision === 'Validée' ? 'success' : 'info');
        }

        // Export iCalendar (.ics) conforme RFC 5545 (Horaires de travail + RDV)
        function exportScheduleICS() {
            const events = getFilteredScheduleEvents();
            if (!events.length) {
                showToast('Aucun événement à exporter pour ce filtre.', 'warning');
                return;
            }
            const escapeICS = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
            const fmtDT = (d, t) => `${d.replace(/-/g, '')}T${t.replace(/:/g, '')}00`;
            const nowStamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

            const effectiveEmp = isAdmin()
                ? (state.scheduleEmployeeFilter === 'ALL' ? null : getEmployeeById(state.scheduleEmployeeFilter))
                : getEmployeeById(state.connectedEmployeeId);

            const lines = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Star Design//Dashboard Calendrier//FR',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
                `X-WR-CALNAME:Star Design - ${effectiveEmp ? effectiveEmp.name : 'Équipe'}`
            ];

            events.forEach(ev => {
                const emp = getEmployeeById(ev.employeeId);
                const prefix = ev.type === 'appointment' ? '[RDV]' : '[Travail]';
                lines.push('BEGIN:VEVENT');
                lines.push(`UID:${ev.id}@stardesign.local`);
                lines.push(`DTSTAMP:${nowStamp}`);
                lines.push(`DTSTART:${fmtDT(ev.date, ev.startTime)}`);
                lines.push(`DTEND:${fmtDT(ev.date, ev.endTime)}`);
                lines.push(`SUMMARY:${escapeICS(`${prefix} ${ev.title} (${emp ? emp.name : ''})`)}`);
                if (ev.location) lines.push(`LOCATION:${escapeICS(ev.location)}`);
                if (ev.notes) lines.push(`DESCRIPTION:${escapeICS(ev.notes)}`);
                lines.push('END:VEVENT');
            });

            lines.push('END:VCALENDAR');
            const slug = effectiveEmp ? effectiveEmp.name.toLowerCase().replace(/\s+/g, '-') : 'equipe';
            downloadFile(`star-design-edt-${slug}.ics`, lines.join('\r\n') + '\r\n', 'text/calendar;charset=utf-8');
            addLog('Planning', `Export iCalendar (.ics) généré (${events.length} événement(s) — horaires & RDV).`);
            showToast(`Fichier star-design-edt-${slug}.ics téléchargé !`, 'success');
        }

        /* ============================================================================
         * MODULE 6 : JOURNAL D'ACTIVITÉ (LOGS)
         * ============================================================================ */
        function renderLogs(container) {
            const categories = ['ALL', ...new Set(state.data.logs.map(l => l.category))];
            const logs = state.logCategoryFilter === 'ALL'
                ? state.data.logs
                : state.data.logs.filter(l => l.category === state.logCategoryFilter);

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Journal d'activité (Audit)</h1>
                        <p class="text-sm text-slate-500 mt-0.5">Historique horodaté des opérations : photos, stock, horaires, RDV, factures et actions RGPD.</p>
                    </div>
                    <select onchange="state.logCategoryFilter=this.value; renderCurrentSection()" class="px-3.5 py-2 text-xs font-semibold rounded-xl bg-white border border-slate-200 text-slate-700 outline-none">
                        ${categories.map(c => `<option value="${escapeHtml(c)}" ${state.logCategoryFilter === c ? 'selected' : ''}>${c === 'ALL' ? 'Toutes les catégories' : escapeHtml(c)}</option>`).join('')}
                    </select>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden divide-y divide-slate-100">
                    ${logs.length === 0 ? `<div class="p-10 text-center text-sm text-slate-500">Aucune entrée.</div>` : logs.map(log => {
                        const isAdm = (log.actor || '').includes('Admin');
                        return `
                        <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:bg-slate-50/70 transition">
                            <div class="flex items-start gap-3">
                                <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase bg-slate-100 text-slate-700 shrink-0">${escapeHtml(log.category)}</span>
                                <div>
                                    <p class="text-sm text-slate-800">${escapeHtml(log.message)}</p>
                                    <span class="inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded-full ${isAdm ? 'bg-indigo-50 text-indigo-700' : 'bg-emerald-50 text-emerald-700'}">${escapeHtml(log.actor)}</span>
                                </div>
                            </div>
                            <span class="text-xs text-slate-400 font-mono shrink-0">${formatDateTimeFR(log.timestamp)}</span>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        /* ============================================================================
         * MODALE SCHÉMA SQL COMPLET CONFORME RGPD (MYSQL / POSTGRESQL)
         * ============================================================================ */
        function openSqlSchemaModal() {
            const sqlCode = `-- =========================================================================
-- STAR DESIGN — SCHÉMA SQL COMPLET CONFORME RGPD (MySQL 8+ / PostgreSQL)
-- Bonnes pratiques RGPD :
--   • Minimisation des données personnelles (uniquement les champs utiles)
--   • Chiffrement recommandé au repos (TDE / AES-256) et en transit (TLS 1.3)
--   • Traçabilité stricte du consentement et conservation limitée à 3 ans
--   • Anonymisation sans perte comptable (ON DELETE RESTRICT sur factures)
-- =========================================================================

-- 1. Employés & comptes utilisateurs
CREATE TABLE users_employees (
    id VARCHAR(36) PRIMARY KEY,
    full_name VARCHAR(120) NOT NULL,
    email VARCHAR(180) UNIQUE NOT NULL,
    password_hash VARCHAR(255) NOT NULL, -- Argon2id ou bcrypt obligatoire
    role VARCHAR(20) NOT NULL CHECK (role IN ('admin', 'employee')),
    job_title VARCHAR(100),
    is_active BOOLEAN NOT NULL DEFAULT TRUE,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- 2. Clients (CRM & Conformité RGPD)
CREATE TABLE clients (
    id VARCHAR(36) PRIMARY KEY,
    full_name VARCHAR(150) NOT NULL,
    email VARCHAR(180) UNIQUE NOT NULL,
    phone VARCHAR(30),
    internal_notes TEXT,
    loyalty_points INT NOT NULL DEFAULT 0,
    consentement BOOLEAN NOT NULL CHECK (consentement = TRUE),
    date_consentement DATE NOT NULL,
    date_retention_limite DATE NOT NULL, -- Calculée à date_consentement + 3 ans
    is_anonymized BOOLEAN NOT NULL DEFAULT FALSE,
    anonymized_at TIMESTAMP NULL,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- 3. Devis & Factures informels (conservés même après anonymisation client)
CREATE TABLE quotes_invoices (
    id VARCHAR(36) PRIMARY KEY,
    doc_type VARCHAR(15) NOT NULL CHECK (doc_type IN ('devis', 'facture')),
    client_id VARCHAR(36) NOT NULL REFERENCES clients(id) ON DELETE RESTRICT,
    issue_date DATE NOT NULL,
    status VARCHAR(25) NOT NULL DEFAULT 'En attente',
    total_amount DECIMAL(10, 2) NOT NULL DEFAULT 0.00,
    items_json JSON NOT NULL,
    points_credited BOOLEAN NOT NULL DEFAULT FALSE,
    notes TEXT,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- 4. Produits & Annonces Vitrine
CREATE TABLE products (
    id VARCHAR(36) PRIMARY KEY,
    name VARCHAR(160) NOT NULL,
    category VARCHAR(80) NOT NULL,
    price DECIMAL(10, 2) NOT NULL,
    stock_qty INT NOT NULL DEFAULT 0 CHECK (stock_qty >= 0),
    alert_threshold INT NOT NULL DEFAULT 2,
    description TEXT,
    listing_status VARCHAR(25) NOT NULL DEFAULT 'Brouillon'
        CHECK (listing_status IN ('Brouillon', 'En ligne', 'Rupture de stock')),
    is_featured BOOLEAN NOT NULL DEFAULT FALSE,
    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- 5. Galerie Multi-Photos par annonce (Relation 1-N)
CREATE TABLE product_images (
    id VARCHAR(36) PRIMARY KEY,
    product_id VARCHAR(36) NOT NULL REFERENCES products(id) ON DELETE CASCADE,
    image_url TEXT NOT NULL,
    caption VARCHAR(160),
    is_cover BOOLEAN NOT NULL DEFAULT FALSE,
    sort_order INT NOT NULL DEFAULT 0,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);
CREATE INDEX idx_product_images_order ON product_images(product_id, sort_order);

-- 6. Emplois du temps : Horaires de travail, RDV & Absences
CREATE TABLE schedule_events (
    id VARCHAR(36) PRIMARY KEY,
    event_type VARCHAR(20) NOT NULL CHECK (event_type IN ('work_shift', 'appointment', 'absence')),
    employee_id VARCHAR(36) NOT NULL REFERENCES users_employees(id) ON DELETE CASCADE,
    client_id VARCHAR(36) NULL REFERENCES clients(id) ON DELETE SET NULL,
    title VARCHAR(180) NOT NULL,
    event_date DATE NOT NULL,
    start_time TIME NOT NULL,
    end_time TIME NOT NULL,
    location VARCHAR(150),
    notes TEXT,
    status VARCHAR(20) NOT NULL DEFAULT 'Confirmé', -- Pour absences : En attente | Validée | Refusée
    created_by_role VARCHAR(20) NOT NULL CHECK (created_by_role IN ('admin', 'employee')),
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);
CREATE INDEX idx_schedule_emp_date ON schedule_events(employee_id, event_date);

-- 7. Journal d'audit RGPD & Activité
CREATE TABLE rgpd_audit_logs (
    id VARCHAR(36) PRIMARY KEY,
    actor_label VARCHAR(120) NOT NULL,
    category VARCHAR(40) NOT NULL,
    action_detail TEXT NOT NULL,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

-- =========================================================================
-- PROCÉDURES RGPD : DROIT À L'OUBLI (ART. 17) & PURGE AUTOMATIQUE À 3 ANS
-- =========================================================================

-- A) Requête d'anonymisation d'un client spécifique (sans casser les factures)
-- UPDATE clients
-- SET full_name = CONCAT('Client Anonymisé #', id),
--     email = CONCAT('anonyme-', LOWER(id), '@rgpd.local'),
--     phone = '00 00 00 00 00',
--     internal_notes = '[Effacé conformément au RGPD Art. 17]',
--     is_anonymized = TRUE,
--     anonymized_at = CURRENT_TIMESTAMP
-- WHERE id = :target_client_id AND is_anonymized = FALSE;

-- B) Purge / Anonymisation automatique quotidienne (CRON / Event Scheduler)
--    des dossiers dépassant la durée légale de conservation de 3 ans :
-- UPDATE clients
-- SET full_name = CONCAT('Client Expiré #', id),
--     email = CONCAT('expire-', LOWER(id), '@rgpd.local'),
--     phone = '00 00 00 00 00',
--     internal_notes = '[Purge automatique RGPD — conservation 3 ans dépassée]',
--     is_anonymized = TRUE,
--     anonymized_at = CURRENT_TIMESTAMP
-- WHERE is_anonymized = FALSE AND date_retention_limite < CURRENT_DATE;`;

            openModal('Schéma SQL complet — Conforme RGPD', `
                <p class="text-xs text-slate-600 mb-3">
                    Structure relationnelle complète (MySQL / PostgreSQL) incluant la galerie multi-photos (<code>product_images</code>), le calendrier unifié (<code>schedule_events</code>), le journal d'audit (<code>rgpd_audit_logs</code>) et les procédures d'anonymisation / purge à 3 ans.
                </p>
                <pre class="bg-slate-950 text-slate-100 p-4 rounded-2xl text-xs overflow-x-auto leading-relaxed max-h-[58vh] font-mono">${escapeHtml(sqlCode)}</pre>
                <div class="mt-4 flex justify-end gap-2">
                    <button id="copy-sql-btn" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-800 transition">Copier le SQL</button>
                    <button id="dl-sql-btn" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition">Télécharger .sql</button>
                </div>
            `, 'max-w-4xl');

            document.getElementById('copy-sql-btn').addEventListener('click', () => copyToClipboard(sqlCode, 'Schéma SQL copié !'));
            document.getElementById('dl-sql-btn').addEventListener('click', () => {
                downloadFile('star-design-rgpd-schema.sql', sqlCode, 'application/sql');
                showToast('Fichier star-design-rgpd-schema.sql téléchargé.', 'success');
            });
        }

        /* ============================================================================
         * 6. INITIALISATION AU CHARGEMENT
         * ============================================================================ */
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            updateRoleUI();
            updateSidebarBadges();
            updateNavActiveState();
            renderCurrentSection();
        });
    </script>
</body>
