<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Design — Dashboard de Gestion</title>
    <!-- Police Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Impression propre pour les devis et factures */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-document, #printable-document * {
                visibility: visible;
            }
            #printable-document {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                padding: 24px;
                background: #ffffff !important;
                box-shadow: none !important;
                border: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 overflow-x-hidden">

    <!-- ==================== BARRE SUPÉRIEURE FIXE ==================== -->
    <header class="fixed top-0 left-0 right-0 h-16 bg-white/95 backdrop-blur border-b border-slate-200 z-40 px-3 sm:px-5 lg:pl-[17.25rem] flex items-center justify-between gap-2 sm:gap-4">

        <div class="flex items-center gap-2 lg:hidden shrink-0">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <div onclick="navigate('overview')" class="w-8 h-8 rounded-xl bg-slate-900 flex items-center justify-center cursor-pointer">
                <svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/>
                </svg>
            </div>
        </div>

        <!-- Centre-gauche : Recherche globale instantanée -->
        <div class="relative flex-1 max-w-md">

                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input
                    id="global-search-input"
                    type="text"
                    placeholder="Rechercher client, annonce, devis, RDV..."

    <!-- ==================== SCRIPT APPLICATIF ==================== -->
    <script>
        /* ============================================================================
         * 1. ÉTAT GLOBAL, CONSTANTES & UTILITAIRES
         * ============================================================================ */
        const STORAGE_KEY = 'star_design_dashboard_v2';
        const FALLBACK_IMG = 'https://placehold.co/700x500/e2e8f0/475569?text=Star+Design';

        const state = {
            currentSection: 'overview',
            role: 'admin', // 'admin' | 'employee'
            connectedEmployeeId: 'EMP-1', // Utilisé lorsque role === 'employee'
            inventoryTab: 'manage', // 'manage' | 'storefront'
            inventoryOnlyLowStock: false,
            cardPhotoIndex: {}, // Index de photo active par carte vitrine
            billingFilter: 'all', // 'all' | 'devis' | 'facture'
            scheduleTab: 'calendar', // 'calendar' | 'leaves'
            calendarView: 'week', // 'week' | 'month'
            calendarAnchorDate: toISODate(new Date()), // Date de référence pour semaine / mois
            scheduleEmployeeFilter: 'ALL', // Utilisé en mode Admin ('ALL' ou employeeId)
            logCategoryFilter: 'ALL',
            highlightId: null,
            data: null
        };

        // État temporaire pour l'édition multi-photos dans la modale produit
        let editingPhotos = [];
        // État temporaire pour le carrousel de la fiche produit vitrine
        let lightboxState = { productId: null, index: 0 };
        let confirmCallback = null;

        function toISODate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function parseISODate(isoStr) {
            const [y, m, d] = isoStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function offsetDate(days, baseIso = null) {
            const d = baseIso ? parseISODate(baseIso) : new Date();
            d.setDate(d.getDate() + days);
            return toISODate(d);
        }

        // Retourne le lundi de la semaine contenant isoStr
        function getMondayOfWeek(isoStr) {
            const d = parseISODate(isoStr);
            const day = d.getDay(); // 0 = Dimanche, 1 = Lundi...
            const diff = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diff);
            return toISODate(d);
        }

        function addYearsFR(isoDateStr, years) {
            if (!isoDateStr) return '—';
            const d = parseISODate(isoDateStr);
            d.setFullYear(d.getFullYear() + years);
            return d.toLocaleDateString('fr-FR');
        }

        function formatDateFR(isoDateStr, opts = { day: '2-digit', month: 'short', year: 'numeric' }) {
            if (!isoDateStr) return '—';
            const d = isoDateStr.includes('T') ? new Date(isoDateStr) : parseISODate(isoDateStr);
            if (isNaN(d.getTime())) return isoDateStr;
            return d.toLocaleDateString('fr-FR', opts);
        }

        function formatDateTimeFR(isoString) {
            const d = new Date(isoString);
            if (isNaN(d.getTime())) return isoString;
            return d.toLocaleString('fr-FR', {
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function formatEuro(amount) {
            return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(Number(amount) || 0);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function generateId(prefix) {
            return `${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.floor(Math.random() * 900 + 100)}`;
        }

        function isAdmin() {
            return state.role === 'admin';
        }

        function getEmployeeById(id) {
            return state.data.employees.find(e => e.id === id);
        }

        function getCurrentActorLabel() {
            if (isAdmin()) return 'Admin / Direction';
            const emp = getEmployeeById(state.connectedEmployeeId);
            return emp ? `Employé (${emp.name})` : 'Employé';
        }

        function timeToMinutes(hhmm) {
            const [h, m] = (hhmm || '09:00').split(':').map(Number);
            return h * 60 + (m || 0);
        }

        function copyToClipboard(text, successMsg = 'Copié dans le presse-papiers !') {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast(successMsg, 'success');
            } catch (err) {
                showToast('Impossible de copier automatiquement.', 'error');
            }
        }

        function downloadFile(filename, content, mimeType) {
            try {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (err) {
                showToast('Erreur lors du téléchargement.', 'error');
            }
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.clients && parsed.products && parsed.scheduleEvents && parsed.employees) {
                        state.data = parsed;
                        return;
                    }
                }
            } catch (e) {
                console.warn('Chargement des données démo suite à une erreur localStorage.', e);
            }
            state.data = createDemoData();
            saveData();
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
            } catch (e) {
                showToast('Espace de stockage local saturé. Supprimez quelques photos ou réduisez leur nombre.', 'error');
            }
            updateSidebarBadges();
        }

        function addLog(category, message) {
            state.data.logs.unshift({
                id: generateId('LOG'),
                timestamp: new Date().toISOString(),
                actor: getCurrentActorLabel(),
                category,
                message
            });
            if (state.data.logs.length > 200) {
                state.data.logs = state.data.logs.slice(0, 200);
            }
            saveData();
        }

        /* ============================================================================
         * 3. INTERFACE UTILISATEUR : TOASTS, MODALES, NAVIGATION & RÔLES
         * ============================================================================ */
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const styles = {
                success: 'bg-emerald-600 text-white border-emerald-500',
                error: 'bg-rose-600 text-white border-rose-500',
                warning: 'bg-amber-500 text-white border-amber-400',
                info: 'bg-slate-900 text-white border-slate-700'
            };
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl border text-xs sm:text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300 translate-y-2 opacity-0 ${styles[type] || styles.info}`;
            toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3400);
        }

        function openModal(title, htmlContent, maxWidthClass = 'max-w-2xl') {
            const overlay = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            box.className = `bg-white rounded-2xl shadow-2xl border border-slate-200 w-full ${maxWidthClass} max-h-[92vh] flex flex-col overflow-hidden`;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = htmlContent;
            overlay.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function openConfirm({ title, message, confirmLabel = 'Confirmer', variant = 'danger', onConfirm }) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            const btn = document.getElementById('confirm-action-btn');
            const iconWrap = document.getElementById('confirm-icon-wrap');
            btn.textContent = confirmLabel;
            if (variant === 'danger') {
                btn.className = 'px-4 py-2 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 transition';
                iconWrap.className = 'w-11 h-11 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center shrink-0';
            } else {
                btn.className = 'px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition';
                iconWrap.className = 'w-11 h-11 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0';
            }
            confirmCallback = onConfirm;
            document.getElementById('confirm-overlay').classList.remove('hidden');
        }

        function closeConfirm() {
            document.getElementById('confirm-overlay').classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('confirm-action-btn').addEventListener('click', () => {
            if (typeof confirmCallback === 'function') {
                const fn = confirmCallback;
                closeConfirm();
                fn();
            }
        });

        function toggleMobileSidebar(forceState) {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const shouldOpen = typeof forceState === 'boolean' ? forceState : sidebar.classList.contains('-translate-x-full');
            if (shouldOpen) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function navigate(section, options = {}) {
            state.currentSection = section;
            state.highlightId = options.highlightId || null;
            if (options.inventoryOnlyLowStock !== undefined) {
                state.inventoryOnlyLowStock = options.inventoryOnlyLowStock;
                state.inventoryTab = 'manage';
            }
            if (options.calendarAnchorDate) {
                state.calendarAnchorDate = options.calendarAnchorDate;
            }
            toggleMobileSidebar(false);
            updateNavActiveState();
            renderCurrentSection();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateNavActiveState() {
            document.querySelectorAll('.nav-item').forEach(btn => {
                const isActive = btn.dataset.nav === state.currentSection;
                if (isActive) {
                    btn.className = 'nav-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-semibold bg-indigo-600 text-white shadow-sm shadow-indigo-950/40 transition';
                } else {
                    btn.className = 'nav-item w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition';
                }
            });
        }

        function updateSidebarBadges() {
            const clientsCount = state.data.clients.filter(c => !c.anonymized).length;
            const pendingQuotes = state.data.documents.filter(d => d.type === 'devis' && d.status === 'En attente').length;
            const lowStockCount = state.data.products.filter(p => p.stock <= p.threshold).length;
            const pendingLeaves = state.data.leaves.filter(l => l.status === 'En attente').length;

            document.getElementById('badge-clients').textContent = clientsCount;

            const qBadge = document.getElementById('badge-pending-quotes');
            qBadge.textContent = pendingQuotes;
            qBadge.classList.toggle('hidden', pendingQuotes === 0);

            const sBadge = document.getElementById('badge-low-stock');
            sBadge.textContent = lowStockCount;
            sBadge.classList.toggle('hidden', lowStockCount === 0);

            const lBadge = document.getElementById('badge-pending-leaves');
            lBadge.textContent = pendingLeaves;
            lBadge.classList.toggle('hidden', pendingLeaves === 0);
        }

                    state.data = createDemoData();
                    state.connectedEmployeeId = state.data.employees[0].id;
                    addLog('Système', 'Réinitialisation complète des données de démonstration.');
                    saveData();
                    updateRoleUI();
                    renderCurrentSection();
                    showToast('Données de démonstration réinitialisées.', 'success');
                }
            });
        }

         * ============================================================================ */
        function handleGlobalSearch(query) {
            const q = (query || '').trim().toLowerCase();
            const resultsBox = document.getElementById('global-search-results');
            const clearBtn = document.getElementById('clear-search-btn');
            clearBtn.classList.toggle('hidden', q.length === 0);

            if (!q) {
                resultsBox.classList.add('hidden');
                return;
            }

            const matchedClients = state.data.clients.filter(c =>
                c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || c.notes.toLowerCase().includes(q)
            );
            const matchedProducts = state.data.products.filter(p =>
                p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q)
            );
            const matchedDocs = state.data.documents.filter(d => {
                const client = getClientById(d.clientId);
                return d.id.toLowerCase().includes(q) || d.type.toLowerCase().includes(q) || (client && client.name.toLowerCase().includes(q));
            });
            const matchedRdvs = state.data.scheduleEvents.filter(ev => {
                if (!isAdmin() && ev.employeeId !== state.connectedEmployeeId) return false;
                const emp = getEmployeeById(ev.employeeId);
                const client = ev.clientId ? getClientById(ev.clientId) : null;
                return ev.title.toLowerCase().includes(q) ||
                    (ev.notes || '').toLowerCase().includes(q) ||
                    (emp && emp.name.toLowerCase().includes(q)) ||
                    (client && client.name.toLowerCase().includes(q));
            });

            if (!matchedClients.length && !matchedProducts.length && !matchedDocs.length && !matchedRdvs.length) {
                resultsBox.innerHTML = `<div class="p-4 text-xs sm:text-sm text-slate-500 text-center">Aucun résultat pour « ${escapeHtml(query)} »</div>`;
                resultsBox.classList.remove('hidden');
                return;
            }

            let html = '';
            if (matchedClients.length) {
                html += `<div class="p-2"><div class="px-2 py-1 text-[10px] font-bold uppercase text-slate-400">Clients (${matchedClients.length})</div>`;
                matchedClients.slice(0, 3).forEach(c => {
                    html += `<button onclick="jumpFromSearch('clients','${c.id}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-indigo-50 flex items-center justify-between transition">
                        <div class="min-w-0 pr-2"><div class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(c.name)}</div><div class="text-[11px] text-slate-500 truncate">${escapeHtml(c.email)}</div></div>
                        <span class="text-[11px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full shrink-0">${c.loyaltyPoints} pts</span>
                    </button>`;
                });
                html += `</div>`;
            }
            if (matchedProducts.length) {
                html += `<div class="p-2"><div class="px-2 py-1 text-[10px] font-bold uppercase text-slate-400">Produits & Annonces (${matchedProducts.length})</div>`;
                matchedProducts.slice(0, 3).forEach(p => {
                    html += `<button onclick="jumpFromSearch('inventory','${p.id}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-indigo-50 flex items-center justify-between transition">
                        <div class="min-w-0 pr-2"><div class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(p.name)}</div><div class="text-[11px] text-slate-500">${escapeHtml(p.category)} • ${(p.photos || []).length} photo(s)</div></div>
                        <span class="text-xs font-bold text-slate-700 shrink-0">${formatEuro(p.price)}</span>
                    </button>`;
                });
                html += `</div>`;
            }
            if (matchedDocs.length) {
                html += `<div class="p-2"><div class="px-2 py-1 text-[10px] font-bold uppercase text-slate-400">Devis & Factures (${matchedDocs.length})</div>`;
                matchedDocs.slice(0, 3).forEach(d => {
                    const client = getClientById(d.clientId);
                    html += `<button onclick="jumpFromSearch('billing','${d.id}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-indigo-50 flex items-center justify-between transition">
                        <div class="min-w-0 pr-2"><div class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(d.id)} — ${escapeHtml(client ? client.name : '')}</div><div class="text-[11px] text-slate-500">${d.type.toUpperCase()} • ${escapeHtml(d.status)}</div></div>
                        <span class="text-xs font-bold text-indigo-700 shrink-0">${formatEuro(calcDocTotal(d))}</span>
                    </button>`;
                });
                html += `</div>`;
            }
            if (matchedRdvs.length) {
                html += `<div class="p-2"><div class="px-2 py-1 text-[10px] font-bold uppercase text-slate-400">Planning & RDV (${matchedRdvs.length})</div>`;
                matchedRdvs.slice(0, 3).forEach(ev => {
                    const emp = getEmployeeById(ev.employeeId);
                    html += `<button onclick="jumpFromSearch('schedule','${ev.id}','${ev.date}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-emerald-50 flex items-center justify-between transition">
                        <div class="min-w-0 pr-2"><div class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(ev.title)}</div><div class="text-[11px] text-slate-500">${formatDateFR(ev.date)} • ${ev.startTime}-${ev.endTime} (${escapeHtml(emp ? emp.name : '')})</div></div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0 ${ev.type === 'appointment' ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-100 text-indigo-700'}">${ev.type === 'appointment' ? 'RDV' : 'Travail'}</span>
                    </button>`;
                });
                html += `</div>`;
            }

            resultsBox.innerHTML = html;
            resultsBox.classList.remove('hidden');
        }

        function jumpFromSearch(section, id, eventDate = null) {
            clearGlobalSearch();
            if (section === 'inventory') state.inventoryOnlyLowStock = false;
            if (section === 'billing') state.billingFilter = 'all';
            if (section === 'schedule') state.scheduleTab = 'calendar';
            navigate(section, { highlightId: id, calendarAnchorDate: eventDate || undefined });
        }

        function clearGlobalSearch() {
            document.getElementById('global-search-input').value = '';
            document.getElementById('global-search-results').classList.add('hidden');
            document.getElementById('clear-search-btn').classList.add('hidden');
        }

        document.addEventListener('click', (e) => {
            const input = document.getElementById('global-search-input');
            const box = document.getElementById('global-search-results');
            if (input && box && !input.contains(e.target) && !box.contains(e.target)) {
                box.classList.add('hidden');
            }
        });

        /* ============================================================================
         * 5. CALCULS MÉTIER & ROUTEUR
         * ============================================================================ */
        function getClientById(id) {
            return state.data.clients.find(c => c.id === id);
        }

        function calcDocTotal(doc) {
            return (doc.items || []).reduce((sum, item) => sum + (Number(item.qty) * Number(item.unitPrice)), 0);
        }

        function renderCurrentSection() {
            const container = document.getElementById('main-content');
            switch (state.currentSection) {
                case 'overview': renderOverview(container); break;
                case 'clients': renderClients(container); break;
                case 'billing': renderBilling(container); break;
                case 'inventory': renderInventory(container); break;
                case 'schedule': renderSchedule(container); break;
                case 'logs': renderLogs(container); break;
                default: renderOverview(container);
            }
        }

                                <div class="mt-3 flex flex-wrap items-center gap-2 text-[11px]">
                                    ${c.anonymized ? `
                                        <span class="px-2.5 py-1 rounded-full bg-slate-200 text-slate-700 font-semibold">Anonymisé (Droit à l'oubli appliqué)</span>
                                    ` : `
                                        <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-semibold">✓ Consentement : ${formatDateFR(c.gdprConsentDate)}</span>
                                        <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 font-medium">Limite 3 ans : ${addYearsFR(c.gdprConsentDate, 3)}</span>
                                    `}
                                </div>
                            </div>

                            <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
                                <div class="flex flex-wrap gap-2">
                                    ${!c.anonymized ? `<button onclick="openClientModal('${c.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Modifier</button>` : ''}
                                    <button onclick="exportClientJSON('${c.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 transition">Exporter JSON</button>
                                </div>
                                ${!c.anonymized ? `
                                    <button onclick="${isAdmin() ? `requestAnonymizeClient('${c.id}')` : `showToast('Action réservée au rôle Admin / Direction.', 'warning')`}" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${isAdmin() ? 'bg-rose-50 hover:bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">
                                        Anonymiser (RGPD)
                                    </button>` : ''}
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        function openClientModal(clientId = null) {
            const client = clientId ? getClientById(clientId) : null;
            const isEdit = !!client;
            const today = offsetDate(0);

            openModal(isEdit ? 'Modifier le dossier client' : 'Nouveau dossier client', `
                <form id="client-form" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Nom / Raison sociale *</label>
                            <input type="text" name="name" required value="${escapeHtml(client?.name || '')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Téléphone *</label>
                            <input type="text" name="phone" required value="${escapeHtml(client?.phone || '')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">E-mail *</label>
                            <input type="email" name="email" required value="${escapeHtml(client?.email || '')}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Points de fidélité</label>
                            <input type="number" name="loyaltyPoints" min="0" value="${client ? client.loyaltyPoints : 0}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Notes internes</label>
                        <textarea name="notes" rows="3" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 focus:border-indigo-500 outline-none">${escapeHtml(client?.notes || '')}</textarea>
                    </div>
                    <div class="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200">
                        <label class="flex items-start gap-2.5 cursor-pointer">
                            <input type="checkbox" name="gdprConsent" required ${isEdit ? 'checked' : ''} class="mt-0.5 w-4 h-4 rounded text-emerald-600">
                            <span class="text-xs text-emerald-900 leading-relaxed">
                                <strong>Consentement RGPD obligatoire * :</strong> Le client consent au traitement de ses données par Star Design pour la gestion commerciale et fidélité (durée de conservation : 3 ans).
                            </span>
                        </label>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200">Annuler</button>
                        <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700">${isEdit ? 'Enregistrer' : 'Créer le client'}</button>
                    </div>
                </form>
            `);

            document.getElementById('client-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const payload = {
                    name: fd.get('name').trim(),
                    email: fd.get('email').trim(),
                    phone: fd.get('phone').trim(),
                    notes: fd.get('notes').trim(),
                    loyaltyPoints: Math.max(0, parseInt(fd.get('loyaltyPoints'), 10) || 0),
                    gdprConsent: true
                };
                if (isEdit) {
                    Object.assign(client, payload);
                    addLog('Clients', `Dossier client mis à jour : ${client.name} (${client.id}).`);
                } else {
                    const newClient = { id: generateId('CLI'), ...payload, gdprConsentDate: today, anonymized: false };
                    state.data.clients.unshift(newClient);
                    addLog('Clients', `Nouveau client créé avec consentement RGPD : ${newClient.name} (${newClient.id}).`);
                }
                saveData();
                closeModal();
                renderCurrentSection();
                showToast(isEdit ? 'Dossier client mis à jour.' : 'Client créé avec succès.', 'success');
            });
        }

        function adjustLoyaltyPoints(clientId, delta) {
            const c = getClientById(clientId);
            if (!c || c.anonymized) return;
            c.loyaltyPoints = Math.max(0, c.loyaltyPoints + delta);
            addLog('Fidélité', `Ajustement manuel ${delta > 0 ? '+' : ''}${delta} pts pour ${c.name} (solde : ${c.loyaltyPoints} pts).`);
            saveData();
            renderCurrentSection();
            showToast(`Solde fidélité : ${c.loyaltyPoints} pts`, 'success');
        }

        function exportClientJSON(clientId) {
            const c = getClientById(clientId);
            if (!c) return;
            const payload = {
                exportedAt: new Date().toISOString(),
                controller: 'Star Design',
                gdprRight: 'Portabilité des données (Article 20 RGPD)',
                client: c,
                documents: state.data.documents.filter(d => d.clientId === c.id),
                appointments: state.data.scheduleEvents.filter(ev => ev.clientId === c.id)
            };
            downloadFile(`rgpd-export-${c.id}.json`, JSON.stringify(payload, null, 2), 'application/json');
            addLog('RGPD', `Export JSON (portabilité) généré pour ${c.name} (${c.id}).`);
            showToast(`Fichier rgpd-export-${c.id}.json téléchargé.`, 'success');
        }

        function requestAnonymizeClient(clientId) {
            if (!isAdmin()) return;
            const c = getClientById(clientId);
            if (!c || c.anonymized) return;
            openConfirm({
                title: 'Anonymiser ce dossier client (RGPD) ?',
                message: `Les données personnelles de "${c.name}" seront effacées de manière irréversible tout en préservant l'historique comptable.`,
                confirmLabel: 'Anonymiser',
                onConfirm: () => {
                    const oldName = c.name;
                    c.name = `Client Anonymisé #${c.id}`;
                    c.email = `anonyme-${c.id.toLowerCase()}@rgpd.local`;
                    c.phone = '00 00 00 00 00';
                    c.notes = '[Données personnelles effacées — Droit à l\'oubli RGPD Art. 17]';
                    c.anonymized = true;
                    addLog('RGPD', `Anonymisation exécutée pour l'ancien dossier "${oldName}" (${c.id}).`);
                    saveData();
                    renderCurrentSection();
                    showToast('Dossier client anonymisé conformément au RGPD.', 'success');
                }
            });
        }

        /* ============================================================================
         * MODULE 3 : DEVIS & FACTURES INFORMELS
         * ============================================================================ */
        function renderBilling(container) {
            const docs = state.data.documents.filter(d => state.billingFilter === 'all' || d.type === state.billingFilter);

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Devis & Factures informels</h1>
                        <p class="text-sm text-slate-500 mt-0.5">Conversion devis → facture en 1 clic et crédit automatique de fidélité (1 pt / 10 € payés).</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="openDocModal('devis')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-xs transition">+ Nouveau devis</button>
                        <button onclick="openDocModal('facture')" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold shadow-xs transition">+ Nouvelle facture</button>
                    </div>
                </div>

                <div class="flex items-center gap-2 mb-5">
                    ${['all', 'devis', 'facture'].map(f => {
                        const labels = { all: 'Tous', devis: 'Devis', facture: 'Factures' };
                        return `<button onclick="state.billingFilter='${f}'; renderCurrentSection()" class="px-4 py-2 rounded-xl text-xs font-semibold transition ${state.billingFilter === f ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">${labels[f]}</button>`;
                    }).join('')}
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-100 bg-slate-50/70 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                                    <th class="py-3.5 px-4">Référence</th>
                                    <th class="py-3.5 px-4">Client</th>
                                    <th class="py-3.5 px-4">Date</th>
                                    <th class="py-3.5 px-4">Total</th>
                                    <th class="py-3.5 px-4">Statut</th>
                                    <th class="py-3.5 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${docs.length === 0 ? `<tr><td colspan="6" class="py-10 text-center text-slate-500">Aucun document.</td></tr>` : docs.map(d => {
                                    const client = getClientById(d.clientId);
                                    const badge = d.status === 'Payée' ? 'bg-emerald-100 text-emerald-800'
                                        : d.status === 'Converti' ? 'bg-indigo-100 text-indigo-800'
                                        : 'bg-amber-100 text-amber-800';
                                    return `
                                    <tr class="${state.highlightId === d.id ? 'bg-indigo-50/70' : 'hover:bg-slate-50/60'} transition">
                                        <td class="py-3.5 px-4">
                                            <div class="font-bold text-slate-900">${escapeHtml(d.id)}</div>
                                            <div class="text-[11px] uppercase font-semibold ${d.type === 'facture' ? 'text-indigo-600' : 'text-amber-600'}">${d.type}</div>
                                        </td>
                                        <td class="py-3.5 px-4">
                                            <div class="font-medium text-slate-800">${escapeHtml(client ? client.name : 'Inconnu')}</div>
                                            <div class="text-xs text-slate-400">${d.items.length} ligne(s)</div>
                                        </td>
                                        <td class="py-3.5 px-4 text-xs text-slate-600 whitespace-nowrap">${formatDateFR(d.date)}</td>
                                        <td class="py-3.5 px-4 font-bold text-slate-900 whitespace-nowrap">${formatEuro(calcDocTotal(d))}</td>
                                        <td class="py-3.5 px-4 whitespace-nowrap"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badge}">${escapeHtml(d.status)}</span></td>
                                        <td class="py-3.5 px-4 text-right whitespace-nowrap">
                                            <div class="inline-flex items-center gap-1.5">
                                                ${d.type === 'devis' && d.status !== 'Converti' ? `<button onclick="convertQuoteToInvoice('${d.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-50 hover:bg-indigo-100 text-indigo-700">Convertir en facture</button>` : ''}
                                                ${d.type === 'facture' && d.status !== 'Payée' ? `<button onclick="markInvoicePaid('${d.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 text-emerald-700">Marquer payée</button>` : ''}
                                                <button onclick="openDocPreviewModal('${d.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">Aperçu / PDF</button>
                                                ${isAdmin() ? `<button onclick="requestDeleteDoc('${d.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50" title="Supprimer"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>` : ''}
                                            </div>
                                        </td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function openDocModal(docType) {
            const activeClients = state.data.clients.filter(c => !c.anonymized);
            if (!activeClients.length) {
                showToast('Créez d\'abord un client actif.', 'warning');
                return;
            }
            openModal(docType === 'devis' ? 'Nouveau devis informel' : 'Nouvelle facture informelle', `
                <form id="doc-form" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Client *</label>
                            <select name="clientId" required class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white">
                                ${activeClients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Date</label>
                            <input type="date" name="date" required value="${offsetDate(0)}" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">
                        </div>
                    </div>

                    <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row gap-2">
                        <select id="quick-product-select" class="flex-1 px-3 py-1.5 text-xs rounded-lg border border-slate-300 bg-white">
                            <option value="">— Ajouter rapidement un produit du catalogue —</option>
                            ${state.data.products.map(p => `<option value="${p.id}">${escapeHtml(p.name)} (${formatEuro(p.price)})</option>`).join('')}
                        </select>
                        <button type="button" onclick="addProductLineFromCatalog()" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-700">Insérer</button>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-xs font-semibold text-slate-700">Lignes</label>
                            <button type="button" onclick="addDocItemRow()" class="text-xs font-semibold text-indigo-600">+ Ajouter une ligne</button>
                        </div>
                        <div id="doc-items-container" class="space-y-2"></div>
                        <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-500">Total :</span>
                            <span id="doc-live-total" class="text-lg font-bold text-indigo-700">0,00 €</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Notes</label>
                        <textarea name="notes" rows="2" class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300">${docType === 'devis' ? 'Devis informel valable 30 jours.' : 'Facture informelle — Merci pour votre confiance.'}</textarea>
                    </div>

                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100">Annuler</button>
                        <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700">Enregistrer</button>
                    </div>
                </form>
            `);

            addDocItemRow();
            document.getElementById('doc-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const items = [];
                document.querySelectorAll('.doc-item-row').forEach(row => {
                    const desc = row.querySelector('.item-desc').value.trim();
                    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                    const price = parseFloat(row.querySelector('.item-price').value) || 0;
                    if (desc && qty > 0) items.push({ description: desc, qty, unitPrice: price });
                });
                if (!items.length) {
                    showToast('Ajoutez au moins une ligne valide.', 'warning');
                    return;
                }
                const prefix = docType === 'devis' ? 'DEV' : 'FAC';
                const newDoc = {
                    id: `${prefix}-${new Date().getFullYear()}-${Math.floor(Math.random() * 900 + 100)}`,
                    type: docType,
                    clientId: fd.get('clientId'),
                    date: fd.get('date'),
                    status: 'En attente',
                    pointsCredited: false,
                    items,
                    notes: fd.get('notes').trim()
                };
                state.data.documents.unshift(newDoc);
                const client = getClientById(newDoc.clientId);
                addLog('Facturation', `Création ${docType} ${newDoc.id} pour ${client ? client.name : 'Client'} (${formatEuro(calcDocTotal(newDoc))}).`);
                saveData();
                closeModal();
                renderCurrentSection();
                showToast(`${newDoc.id} enregistré.`, 'success');
            });
        }

        function addDocItemRow(desc = '', qty = 1, price = 0) {
            const wrap = document.getElementById('doc-items-container');
            const row = document.createElement('div');
            row.className = 'doc-item-row grid grid-cols-12 gap-2 items-center';
            row.innerHTML = `
                <input type="text" placeholder="Désignation" value="${escapeHtml(desc)}" required class="item-desc col-span-6 px-3 py-2 text-xs rounded-xl border border-slate-300">
                <input type="number" min="1" value="${qty}" oninput="updateDocLiveTotal()" class="item-qty col-span-2 px-2 py-2 text-xs rounded-xl border border-slate-300 text-center">
                <input type="number" min="0" step="0.01" value="${price}" oninput="updateDocLiveTotal()" class="item-price col-span-3 px-2 py-2 text-xs rounded-xl border border-slate-300 text-right">
                <button type="button" onclick="this.parentElement.remove(); updateDocLiveTotal();" class="col-span-1 text-slate-400 hover:text-rose-600 text-center">✕</button>
            `;
            wrap.appendChild(row);
            updateDocLiveTotal();
        }

        function addProductLineFromCatalog() {
            const sel = document.getElementById('quick-product-select');
            const p = state.data.products.find(x => x.id === sel.value);
            if (!p) return;
            addDocItemRow(p.name, 1, p.price);
            sel.value = '';
        }

        function updateDocLiveTotal() {
            let total = 0;
            document.querySelectorAll('.doc-item-row').forEach(r => {
                total += (parseFloat(r.querySelector('.item-qty').value) || 0) * (parseFloat(r.querySelector('.item-price').value) || 0);
            });
            const el = document.getElementById('doc-live-total');
            if (el) el.textContent = formatEuro(total);
        }

        function convertQuoteToInvoice(docId) {
            const q = state.data.documents.find(d => d.id === docId);
            if (!q || q.type !== 'devis') return;
            q.status = 'Converti';
            const inv = {
                id: `FAC-${new Date().getFullYear()}-${Math.floor(Math.random() * 900 + 100)}`,
                type: 'facture',
                clientId: q.clientId,
                date: offsetDate(0),
                status: 'En attente',
                pointsCredited: false,
                items: JSON.parse(JSON.stringify(q.items)),
                notes: `Convertie depuis ${q.id}. ${q.notes || ''}`.trim()
            };
            state.data.documents.unshift(inv);
            addLog('Facturation', `Devis ${q.id} converti en facture ${inv.id} (${formatEuro(calcDocTotal(inv))}).`);
            saveData();
            renderCurrentSection();
            showToast(`Facture ${inv.id} créée !`, 'success');
        }

        function markInvoicePaid(docId) {
            const d = state.data.documents.find(x => x.id === docId);
            if (!d || d.type !== 'facture' || d.status === 'Payée') return;
            d.status = 'Payée';
            const total = calcDocTotal(d);
            const pts = Math.floor(total / 10);
            const client = getClientById(d.clientId);
            if (client && !d.pointsCredited && !client.anonymized) {
                client.loyaltyPoints += pts;
                d.pointsCredited = true;
            }
            addLog('Facturation', `Facture ${d.id} marquée payée (${formatEuro(total)}) — +${pts} pts crédités à ${client ? client.name : 'Client'}.`);
            saveData();
            renderCurrentSection();
            showToast(`Facture payée ! +${pts} pts de fidélité crédités.`, 'success');
        }

        function requestDeleteDoc(docId) {
            if (!isAdmin()) return;
            openConfirm({
                title: 'Supprimer ce document ?',
                message: `Le document ${docId} sera supprimé définitivement.`,
                confirmLabel: 'Supprimer',
                onConfirm: () => {
                    state.data.documents = state.data.documents.filter(d => d.id !== docId);
                    addLog('Facturation', `Document ${docId} supprimé.`);
                    saveData();
                    renderCurrentSection();
                    showToast('Document supprimé.', 'info');
                }
            });
        }

        function openDocPreviewModal(docId) {
            const doc = state.data.documents.find(d => d.id === docId);
            if (!doc) return;
            const client = getClientById(doc.clientId);
            const total = calcDocTotal(doc);
            const docLabel = doc.type === 'devis' ? 'DEVIS INFORMEL' : 'FACTURE INFORMELLE';

            const plainText = [
                `STAR DESIGN — ${docLabel} (${doc.id})`,
                `Date : ${formatDateFR(doc.date)} | Statut : ${doc.status}`,
                `Client : ${client ? client.name : 'Inconnu'}`,
                `------------------------------------`,
                ...doc.items.map(i => `• ${i.description} x${i.qty} = ${formatEuro(i.qty * i.unitPrice)}`),
                `------------------------------------`,
                `TOTAL : ${formatEuro(total)}`
            ].join('\n');

            openModal(`Aperçu — ${doc.id}`, `
                <div id="printable-document" class="bg-white p-5 rounded-2xl border border-slate-200">
                    <div class="flex items-start justify-between border-b border-slate-200 pb-4 mb-4">
                        <div>
                            <div class="text-xl font-bold text-slate-900">Star Design</div>
                            <div class="text-xs text-slate-500">Studio Design & Mobilier — Document informel</div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-bold text-indigo-700">${docLabel}</div>
                            <div class="text-xs font-mono text-slate-500">${escapeHtml(doc.id)}</div>

        // Compression d'image via Canvas (max 700px, qualité JPEG 0.75) pour préserver localStorage
        function compressImageFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('Lecture impossible'));
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('Image invalide'));
                    img.onload = () => {
                        const MAX_DIM = 700;
                        let { width, height } = img;
                        if (width > MAX_DIM || height > MAX_DIM) {
                            if (width > height) {
                                height = Math.round((height * MAX_DIM) / width);
                                width = MAX_DIM;
                            } else {
                                width = Math.round((width * MAX_DIM) / height);
                                height = MAX_DIM;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
